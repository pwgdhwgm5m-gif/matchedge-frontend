<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchEdge Admin</title>
<style>
:root{--bg:#080d16;--card:#121a29;--inner:#0c1320;--line:#273249;--text:#f6f8fc;--muted:#c2cad8;--teal:#2dd4bf;--amber:#f5b942;--red:#f36a7c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:960px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:20px;font-weight:900}.brand span{color:var(--teal)}button,a.button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 13px;border-radius:11px;text-decoration:none;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px}.stat{padding:14px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:24px;margin-top:5px;color:var(--teal)}.panel{padding:14px;margin-bottom:14px}.panel h2{font-size:14px;margin:0 0 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:690px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase}.yes{color:var(--teal)}.no{color:var(--red)}.location{color:var(--amber);font-weight:750}.empty,.error{color:var(--muted);padding:22px;text-align:center}.error{color:var(--red)}@media(max-width:560px){.app{padding:12px}.stats{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:17px}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><div class="brand">MATCHEDGE <span>ADMIN</span></div><div style="color:var(--muted);font-size:11px;margin-top:4px">Yalnızca eddas34</div></div><a class="button" href="ana-sayfa.html">← Uygulamaya dön</a></div>
  <div id="message" class="empty">Yükleniyor…</div>
  <section id="content" style="display:none">
    <div class="stats"><div class="stat"><span>Toplam üye</span><strong id="total">0</strong></div><div class="stat"><span>Doğrulanmış</span><strong id="verified">0</strong></div><div class="stat"><span>Son girişler</span><strong id="loginTotal">0</strong></div></div>
    <div class="panel"><h2>ÜYELER</h2><div class="table-wrap"><table><thead><tr><th>Kullanıcı</th><th>E-posta</th><th>Kayıt</th><th>Son giriş</th><th>Giriş</th><th>Durum</th></tr></thead><tbody id="users"></tbody></table></div></div>
    <div class="panel"><h2>SON GİRİŞLER VE YAKLAŞIK KONUM</h2><div class="table-wrap"><table><thead><tr><th>Zaman</th><th>Kullanıcı</th><th>Ülke</th><th>Şehir</th><th>İlçe</th><th>Saat dilimi</th><th>Cihaz</th></tr></thead><tbody id="logins"></tbody></table></div></div>
  </section>
</main>
<script>
const API_BASE='https://matchedge-backend-kujb.onrender.com';
const token=localStorage.getItem('matchedge_token');
const fmt=value=>value?new Date(value).toLocaleString('tr-TR'):'—';
const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
async function loadAdmin(){
  const message=document.getElementById('message');
  if(!token){window.location.href='giris.html';return}
  try{
    const response=await fetch(`${API_BASE}/api/admin/users`,{headers:{Authorization:`Bearer ${token}`}});
    if(response.status===401){window.location.href='giris.html';return}
    if(response.status===403){throw new Error('Bu sayfaya yalnızca admin hesabı erişebilir. eddas34 ile çıkış yapıp yeniden giriş yapın.')}
    if(!response.ok)throw new Error('Admin verileri alınamadı.')
    const data=await response.json();
    document.getElementById('total').textContent=data.total||0;
    document.getElementById('verified').textContent=data.verified||0;
    document.getElementById('loginTotal').textContent=data.recentLogins?.length||0;
    document.getElementById('users').innerHTML=(data.users||[]).map(user=>`<tr><td><strong>${safe(user.username)}</strong>${user.role==='admin'?' · ADMIN':''}</td><td>${safe(user.email)}</td><td>${fmt(user.createdAt)}</td><td>${fmt(user.lastLoginAt)}</td><td>${user.loginCount||0}</td><td class="${user.emailVerified?'yes':'no'}">${user.emailVerified?'Doğrulandı':'Bekliyor'}</td></tr>`).join('')||'<tr><td colspan="6">Üye yok</td></tr>';
    document.getElementById('logins').innerHTML=(data.recentLogins||[]).map(item=>`<tr><td>${fmt(item.loginAt)}</td><td><strong>${safe(item.userId?.username||'—')}</strong></td><td class="location">${safe(item.country||item.countryCode||'—')}</td><td class="location">${safe(item.city||'—')}</td><td class="location">${safe(item.district||'—')}</td><td>${safe(item.timezone||'—')}</td><td>${safe(item.userAgent||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Henüz giriş kaydı yok</td></tr>';
    message.style.display='none';document.getElementById('content').style.display='block';
  }catch(error){message.className='error';message.textContent=error.message}
}
loadAdmin();
</script>
</body>
</html>
