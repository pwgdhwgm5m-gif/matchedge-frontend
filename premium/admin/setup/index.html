<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoccerEdge Admin Setup</title><style>body{margin:0;background:#090e18;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:420px;margin:9vh auto;padding:22px}.card{background:#121a29;border:1px solid #243047;border-radius:18px;padding:20px}h1{font-size:22px;margin-top:0}p{color:#9ca9bd;font-size:13px;line-height:1.5}input,button{width:100%;box-sizing:border-box;margin-top:10px;padding:13px;border-radius:11px;border:1px solid #2a3851;background:#0d1421;color:#fff;font-size:15px}button{background:#2dd4bf;color:#05211d;border:0;font-weight:800}.err{color:#f06b78}.ok{color:#2dd4bf}</style></head><body><main class="box"><div class="card"><h1>Premium Admin Setup</h1><p>This is a temporary recovery screen. Enter the one-time setup code from your Render service and choose a new admin password. The password is sent directly to your backend and stored only as a hash.</p><input id="secret" type="password" autocomplete="off" placeholder="One-time setup code"><input id="p1" type="password" autocomplete="new-password" placeholder="New password (12+ characters)"><input id="p2" type="password" autocomplete="new-password" placeholder="Repeat new password"><button onclick="save()">Set Admin Password</button><p id="msg"></p></div></main><script>const API='https://matchedge-backend-kujb.onrender.com';async function save(){const m=document.getElementById('msg');m.className='';if(p1.value.length<12){m.className='err';m.textContent='Password must be at least 12 characters.';return}if(p1.value!==p2.value){m.className='err';m.textContent='Passwords do not match.';return}try{const r=await fetch(API+'/api/admin/setup-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setupSecret:secret.value,newPassword:p1.value})}),j=await r.json();if(!r.ok)throw Error(j.error||'Setup failed');m.className='ok';m.textContent='Password changed. You can now log in as admin.';secret.value=p1.value=p2.value='';setTimeout(()=>location.href='/giris.html?next='+encodeURIComponent('/premium/admin/'),1400)}catch(e){m.className='err';m.textContent=e.message}}</script></body></html>
