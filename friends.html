<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{--card:#171d1e;--inner:#09244b;--line:#364142;--gold:#d9ad58;--muted:#b9c7dc}*{box-sizing:border-box}body{margin:0;background:#0f1415;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--gold);font-size:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.sub,small{color:var(--muted)}.person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}.person:first-child{border-top:0}.btn{border:1px solid var(--gold);background:var(--gold);color:#0f1415;border-radius:9px;padding:9px 11px;font-weight:900}.friend-actions{display:flex;gap:6px;align-items:center}.presence{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#66716f;box-shadow:0 0 0 2px #202526}.presence.online{background:#35c878;box-shadow:0 0 8px rgba(53,200,120,.8)}.presence.unread{background:#ef5350;box-shadow:0 0 9px rgba(239,83,80,.9)}.message-btn.unread{border-color:#ef5350!important;color:#ef5350!important}.mini{border:1px solid var(--line);background:#171d1e;color:#f4f7f6;border-radius:9px;padding:8px 9px;font-weight:850;font-size:11px}.mini.chat{border-color:#39c7c1;color:#39c7c1}.search{display:flex;gap:7px}.search input{flex:1;min-width:0;background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:12px;color:white}.social-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.social-tab{border:1px solid #465253;background:#171d1e;color:#aebdb9;border-radius:10px;padding:10px;font-weight:900}.social-tab.active{background:#35c7bf;border-color:#35c7bf;color:#0f1415}.person-main{flex:1;min-width:0;overflow:hidden}.person-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style><style id="friends-charcoal-fix">html,body,.app{background:#121718!important;color:#f3f6f5!important;min-height:100dvh}.back{background:#202526!important;border-color:#465253!important;color:#c6a8ef!important}.card{background:#202526!important;border-color:#465253!important;color:#f3f6f5!important}.sub,small{color:#aebdb9!important}.person{border-color:#465253!important}.btn{background:#ef6a63!important;border-color:#ef6a63!important;color:#fff!important}h3,b{color:#f3f6f5!important}</style><style id="global-dark-only-no-theme-toggle">:root{color-scheme:dark!important}.theme-toggle,.theme-switch,.theme-mode,.appearance-toggle,#themeToggle,#theme-toggle,#lightMode,#light-mode,[data-theme-toggle],[data-action="toggle-theme"],[data-action="theme"]{display:none!important}</style><script>(function(){try{localStorage.setItem('theme','dark');localStorage.setItem('socceredge_theme','dark')}catch(e){}document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.remove('light','light-mode');document.documentElement.classList.add('dark','dark-mode');document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('.top-actions .icon-btn').forEach(el=>{if(/☀|🌞|🌙/.test(el.textContent||''))el.remove()}))})();</script><link rel="stylesheet" href="dark-ui-v2.css?v=20260922-1">
</head><body><main class="app"><header class="top"><button class="back" onclick="location.href='edge-arena.html'">‹</button><div><b>FRIENDS</b><div class="sub">Requests · your analyst network</div></div></header><div class="social-tabs"><button id="friendsTab" class="social-tab active">Friends</button><button id="followingTab" class="social-tab">Following</button></div><div id="out" class="card">Loading…</div></main><script>const API='https://matchedge-backend-kujb.onrender.com',t=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+t,'Content-Type':'application/json'};if(!t)location.href='giris.html';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch(API+'/api/community/friends',{headers:H}),d=await r.json();const L=(localStorage.getItem('matchedge_lang')||'en')==='tr'?'tr':'en';const friends=d.friends||[],requests=d.requests||[],sent=d.sentRequests||[];let h='<div><h3 style="margin:0">'+(L==='tr'?'Arkadaşlar':'Friends')+'</h3><div class="sub">'+friends.length+' '+(L==='tr'?'arkadaş':'friends')+'</div></div>';
if(requests.length){h+='<div style="margin:18px 0 7px"><b>'+(L==='tr'?'Gelen İstekler':'Incoming Requests')+'</b></div>';h+=requests.map(u=>'<div class="person"><span onclick="location.href=\'social-profile.html?u='+encodeURIComponent(u.username)+'\'"><b>@'+e(u.username)+'</b><br><small>'+e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%</small></span><button class="btn" onclick="event.stopPropagation();accept(\''+u.id+'\')">'+(L==='tr'?'Kabul Et':'Accept')+'</button></div>').join('')}
if(sent.length){h+='<div style="margin:18px 0 7px"><b>'+(L==='tr'?'Gönderilen İstekler':'Sent Requests')+'</b></div>';h+=sent.map(u=>'<div class="person"><span onclick="location.href=\'social-profile.html?u='+encodeURIComponent(u.username)+'\'"><b>@'+e(u.username)+'</b><br><small>'+e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%</small></span><button class="mini" onclick="event.stopPropagation();cancelRequest(\''+u.id+'\')">'+(L==='tr'?'İptal Et':'Cancel')+'</button></div>').join('')}
h+='<div style="margin:18px 0 7px"><b>'+(L==='tr'?'Arkadaşlarım':'My Friends')+'</b></div>';h+=friends.map(u=>'<div class="person"><span onclick="location.href=\'social-profile.html?u='+encodeURIComponent(u.username)+'\'"><b>@'+e(u.username)+'</b><br><small>'+e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%</small></span><div class="friend-actions"><button class="mini" onclick="event.stopPropagation();location.href=\'mesajlar.html?user='+encodeURIComponent(u.id)+'\'">'+(L==='tr'?'Mesaj':'Message')+'</button><button class="mini chat" onclick="event.stopPropagation();location.href=\'mesajlar.html?user='+encodeURIComponent(u.id)+'&mode=chat\'">💬</button></div></div>').join('')||'<div class="sub" style="padding:14px 0">'+(L==='tr'?'Henüz arkadaşın yok.':'No friends yet.')+'</div>';document.getElementById('out').innerHTML=h}async function accept(id){await fetch(API+'/api/community/friends/'+id+'/accept',{method:'POST',headers:H});load()}async function cancelRequest(id){await fetch(API+'/api/community/friends/'+id,{method:'DELETE',headers:H});load()}load()</script><script>
(function(){
 const L=(localStorage.getItem('matchedge_lang')||'en')==='tr'?'tr':'en',out=document.getElementById('out'),friendsTab=document.getElementById('friendsTab'),followingTab=document.getElementById('followingTab');
 friendsTab.textContent=L==='tr'?'Arkadaşlarım':'Friends';followingTab.textContent=L==='tr'?'Takip Ettiklerim':'Following';
 friendsTab.onclick=()=>{friendsTab.classList.add('active');followingTab.classList.remove('active');load()};
 followingTab.onclick=async()=>{followingTab.classList.add('active');friendsTab.classList.remove('active');out.textContent=L==='tr'?'Yükleniyor…':'Loading…';const r=await fetch(API+'/api/community/following',{headers:H}),d=await r.json(),rows=d.following||[];out.innerHTML='<h3 style="margin:0">'+(L==='tr'?'Takip Ettiklerim':'Following')+'</h3><div class="sub">'+rows.length+' '+(L==='tr'?'analist':'analysts')+'</div>'+((rows.map(u=>'<div class="person"><span class="person-main" onclick="location.href=\\'social-profile.html?u='+encodeURIComponent(u.username)+'\\'"><b>@'+e(u.username)+'</b><small>'+e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%</small></span><button class="mini chat" onclick="event.stopPropagation();window.seUnfollow(\\''+u.id+'\\')">'+(L==='tr'?'Takibi Bırak':'Unfollow')+'</button></div>').join(''))||'<div class="sub" style="padding:14px 0">'+(L==='tr'?'Henüz kimseyi takip etmiyorsun.':'You are not following anyone yet.')+'</div>')};
 window.seUnfollow=async id=>{await fetch(API+'/api/community/follow/'+id,{method:'DELETE',headers:H});followingTab.click()};
})();
</script></body><script src="global-slip.js"></script></html>
