<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{--bg:#101516;--panel:#171d1e;--line:#303b3c;--teal:#3bc8c1;--coral:#ef6a63;--text:#f6f8f7;--muted:#96a4a1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:16px 18px 90px}.top{display:flex;align-items:center;gap:12px;margin:8px 0 18px}.back{width:38px;height:38px;border:0;border-radius:50%;background:#202728;color:#c6a8ef;font-size:22px}.top b{font-size:22px}.sub,small{color:var(--muted)}.social-tabs{display:flex;gap:24px;border-bottom:1px solid #263031;margin-bottom:18px}.social-tab{position:relative;border:0;background:transparent;color:#83908e;padding:10px 2px 12px;font-size:14px;font-weight:850}.social-tab.active{color:#fff}.social-tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--teal);border-radius:2px}.card{background:transparent!important;border:0!important;padding:0!important;margin:0!important}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;font-size:13px;font-weight:900}.request-pill{border:0;background:#202728;color:#fff;border-radius:999px;padding:8px 11px;font-weight:800;font-size:11px}.request-pill strong{background:var(--coral);border-radius:999px;padding:2px 6px;margin-left:5px}.online-strip{display:flex;gap:14px;overflow-x:auto;padding:4px 1px 12px;scrollbar-width:none}.online-person{width:62px;flex:0 0 62px;text-align:center;font-size:10px;overflow:hidden}.avatar{width:52px;height:52px;margin:auto auto 5px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#315f5b,#232c2d);font-size:18px;font-weight:950;position:relative}.avatar i{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:#35c878;border:2px solid var(--bg)}.person{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.055);cursor:pointer}.person-main{flex:1;min-width:0}.person-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.friend-preview{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11px;margin-top:3px}.row-avatar{width:45px;height:45px;flex:0 0 45px;border-radius:50%;display:grid;place-items:center;background:#222b2c;font-weight:900;position:relative}.presence{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#687471;border:2px solid var(--bg)}.presence.online{background:#35c878}.presence.unread{background:var(--coral)}.message-btn,.mini,.btn{border:0;background:transparent;color:var(--teal);font-weight:850;font-size:11px;padding:8px}.message-btn.unread{background:var(--coral);color:white;border-radius:999px;min-width:27px}.request-row{background:#171d1e;border-radius:16px;padding:5px 12px;margin:7px 0}.empty-social{text-align:center;padding:46px 22px;color:var(--muted)}.empty-social .bubble{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:#1b2525;font-size:25px}.empty-social b{display:block;color:#eef3f1;margin-bottom:5px}</style><style id="friends-charcoal-fix">html,body,.app{background:#121718!important;color:#f3f6f5!important;min-height:100dvh}.back{background:#202526!important;border-color:#465253!important;color:#c6a8ef!important}.card{background:#202526!important;border-color:#465253!important;color:#f3f6f5!important}.sub,small{color:#aebdb9!important}.person{border-color:#465253!important}.btn{background:#ef6a63!important;border-color:#ef6a63!important;color:#fff!important}h3,b{color:#f3f6f5!important}</style><style id="global-dark-only-no-theme-toggle">:root{color-scheme:dark!important}.theme-toggle,.theme-switch,.theme-mode,.appearance-toggle,#themeToggle,#them </head><body><main class="app"><header class="top"><button class="back" onclick="location.href='edge-arena.html'">‹</button><div><b>FRIENDS</b><div class="sub">Requests · your analyst network</div></div></header><div class="social-tabs"><button id="friendsTab" class="social-tab active">Friends</button><button id="followingTab" class="social-tab">Following</button></div><div id="out" class="card">Loading…</div></main><script>const API='https://matchedge-backend-kujb.onrender.com',t=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+t,'Content-Type':'application/json'};if(!t)location.href='giris.html';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),L=(localStorage.getItem('matchedge_lang')||'en')==='tr'?'tr':'en';let friendMode=true;
async function load(){const r=await fetch(API+'/api/community/friends',{headers:H}),d=await r.json();const friends=d.friends||[],requests=d.requests||[],sent=d.sentRequests||[];friends.sort((a,b)=>(b.unreadMessages||0)-(a.unreadMessages||0)||Number(b.online)-Number(a.online));const online=friends.filter(x=>x.online);let h='';
if(requests.length)h+='<div class="section-title"><span>'+(L==='tr'?'Arkadaşlık İstekleri':'Friend Requests')+'</span><button class="request-pill" onclick="toggleRequests()">'+(L==='tr'?'Görüntüle':'View')+' <strong>'+requests.length+'</strong></button></div><div id="requestRows" style="display:none">'+requests.map(u=>'<div class="person request-row"><div class="row-avatar">'+e((u.username||'?')[0].toUpperCase())+'</div><span class="person-main"><b>@'+e(u.username)+'</b><span class="friend-preview">'+e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%</span></span><button class="btn" onclick="accept(\''+u.id+'\')">'+(L==='tr'?'Kabul':'Accept')+'</button></div>').join('')+'</div>';
if(sent.length)h+='<div class="section-title"><span>'+(L==='tr'?'Gönderilen İstekler':'Sent Requests')+'</span></div>'+sent.map(u=>'<div class="person"><div class="row-avatar">'+e((u.username||'?')[0].toUpperCase())+'</div><span class="person-main"><b>@'+e(u.username)+'</b><span class="friend-preview">'+(L==='tr'?'İstek gönderildi':'Request sent')+'</span></span><button class="mini" onclick="cancelRequest(\''+u.id+'\')">'+(L==='tr'?'İptal':'Cancel')+'</button></div>').join('');
if(online.length)h+='<div class="section-title"><span>'+(L==='tr'?'Çevrimiçi':'Online')+'</span><small>'+online.length+'</small></div><div class="online-strip">'+online.map(u=>'<div class="online-person" onclick="location.href=\'mesajlar.html?user='+u.id+'\'"><div class="avatar">'+e((u.username||'?')[0].toUpperCase())+'<i></i></div><div>@'+e(u.username)+'</div></div>').join('')+'</div>';
h+='<div class="section-title"><span>'+(L==='tr'?'Mesajlar':'Messages')+'</span><small>'+friends.length+'</small></div>';
h+=friends.length?friends.map(u=>'<div class="person" onclick="location.href=\'mesajlar.html?user='+u.id+'\'"><div class="row-avatar">'+e((u.username||'?')[0].toUpperCase())+'<i class="presence '+(u.unreadMessages?'unread':u.online?'online':'')+'"></i></div><span class="person-main"><b>@'+e(u.username)+'</b><span class="friend-preview">'+(u.unreadMessages?(L==='tr'?'Yeni mesaj':'New message'):u.online?'Online':e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%')+'</span></span>'+(u.unreadMessages?'<button class="message-btn unread">'+u.unreadMessages+'</button>':'<button class="message-btn">➤</button>')+'</div>').join(''):'<div class="empty-social"><div class="bubble">💬</div><b>'+(L==='tr'?'Henüz sohbet yok':'No conversations yet')+'</b><span>'+(L==='tr'?'Arkadaşların olduğunda mesajların burada görünecek.':'Your friend conversations will appear here.')+'</span></div>';
document.getElementById('out').innerHTML=h}
function toggleRequests(){const x=document.getElementById('requestRows');if(x)x.style.display=x.style.display==='none'?'block':'none'}async function accept(id){await fetch(API+'/api/community/friends/'+id+'/accept',{method:'POST',headers:H});load()}async function cancelRequest(id){await fetch(API+'/api/community/friends/'+id,{method:'DELETE',headers:H});load()}load();setInterval(()=>{if(friendMode)load()},12000)</script></script><script>
(function(){
 const L=(localStorage.getItem('matchedge_lang')||'en')==='tr'?'tr':'en',out=document.getElementById('out'),friendsTab=document.getElementById('friendsTab'),followingTab=document.getElementById('followingTab');
 friendsTab.textContent=L==='tr'?'Arkadaşlarım':'Friends';followingTab.textContent=L==='tr'?'Takip Ettiklerim':'Following';
 friendsTab.onclick=()=>{friendMode=true;friendsTab.classList.add('active');followingTab.classList.remove('active');load()};
 followingTab.onclick=async()=>{friendMode=false;followingTab.classList.add('active');friendsTab.classList.remove('active');out.textContent=L==='tr'?'Yükleniyor…':'Loading…';const r=await fetch(API+'/api/community/following',{headers:H}),d=await r.json(),rows=d.following||[];out.innerHTML='<h3 style="margin:0">'+(L==='tr'?'Takip Ettiklerim':'Following')+'</h3><div class="sub">'+rows.length+' '+(L==='tr'?'analist':'analysts')+'</div>'+((rows.map(u=>'<div class="person"><span class="person-main" onclick="location.href=\\'social-profile.html?u='+encodeURIComponent(u.username)+'\\'"><b>@'+e(u.username)+'</b><small>'+e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%</small></span><button class="mini chat" onclick="event.stopPropagation();window.seUnfollow(\\''+u.id+'\\')">'+(L==='tr'?'Takibi Bırak':'Unfollow')+'</button></div>').join(''))||'<div class="sub" style="padding:14px 0">'+(L==='tr'?'Henüz kimseyi takip etmiyorsun.':'You are not following anyone yet.')+'</div>')};
 window.seUnfollow=async id=>{await fetch(API+'/api/community/follow/'+id,{method:'DELETE',headers:H});followingTab.click()};
})();
</script></body><script src="global-slip.js"></script></html>
