<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SoccerEdge Pro - Login</title>
<style>
  :root {
    --bg-base: #0a0e17;
    --bg-card: #121826;
    --bg-card-inner: #0d1220;
    --border-subtle: #1e2636;
    --teal: #2dd4bf;
    --red: #f0556b;
    --green: #4ade80;
    --text-primary: #f2f4f8;
    --text-secondary: #8b93a7;
    --text-muted: #5a6478;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .wrap { max-width: 360px; width: 100%; }
  .brand { text-align: center; margin-bottom: 28px; }
  .brand-name { font-size: 24px; font-weight: 800; }
  .brand-name .premium { color: var(--teal); margin-left: 6px; }
  .brand-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 2px; margin-top: 4px; }

  .lang-toggle {
    position: fixed; top: 16px; right: 16px;
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 15px;
    cursor: pointer;
  }
  .lang-toggle .lang-code { font-size: 9.5px; font-weight: 800; color: var(--text-secondary); margin-left: 2px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 11px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab.active { background: rgba(45,212,191,0.12); border-color: var(--teal); color: var(--teal); }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 22px 20px;
  }
  .field-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
  .field-input {
    width: 100%;
    background: var(--bg-card-inner);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 12px 13px;
    color: var(--text-primary);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .field-input:focus { outline: none; border-color: var(--teal); }
  .field-group { display: none; }
  .field-group.visible { display: block; }

  .submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: var(--teal);
    color: #05201c;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.6; cursor: default; }

  .error-msg {
    background: rgba(240,85,107,0.1);
    border: 1px solid rgba(240,85,107,0.35);
    color: var(--red);
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.show { display: block; }

  .success-msg {
    background: rgba(74,222,128,0.1);
    border: 1px solid rgba(74,222,128,0.35);
    color: var(--green);
    font-size: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
    display: none;
  }
  .success-msg.show { display: block; }

  .forgot-link {
    display: none;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 14px;
    cursor: pointer;
  }
  .forgot-link:hover { color: var(--teal); }

  .install-entry { margin-top:14px; width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--border-subtle); background:transparent; color:var(--text-secondary); font-size:12px; font-weight:700; cursor:pointer; }
  .install-entry:hover { border-color:var(--teal); color:var(--teal); }
  .install-sheet { position:fixed; inset:0; background:rgba(0,0,0,.68); display:none; align-items:flex-end; justify-content:center; z-index:1000; padding:14px; }
  .install-sheet.open { display:flex; }
  .install-panel { width:min(430px,100%); background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:22px; padding:18px; box-shadow:0 -20px 60px rgba(0,0,0,.35); }
  .install-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .install-title { font-size:16px; font-weight:800; }
  .install-close { border:0; background:var(--bg-card-inner); color:var(--text-secondary); width:32px; height:32px; border-radius:50%; font-size:18px; cursor:pointer; }
  .install-slide { min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:12px 8px; }
  .install-icon { font-size:46px; margin-bottom:14px; }
  .install-slide h3 { font-size:17px; margin-bottom:9px; }
  .install-slide p { color:var(--text-secondary); font-size:13px; line-height:1.55; max-width:330px; }
  .install-dots { display:flex; justify-content:center; gap:6px; margin:8px 0 14px; }
  .install-dot { width:7px; height:7px; border-radius:50%; background:var(--text-muted); }
  .install-dot.active { background:var(--teal); width:18px; border-radius:8px; }
  .install-actions { display:flex; gap:8px; }
  .install-actions button { flex:1; padding:11px; border-radius:11px; font-weight:800; cursor:pointer; }
  .install-prev { background:transparent; border:1px solid var(--border-subtle); color:var(--text-secondary); }
  .install-next { background:var(--teal); border:0; color:#05201c; }

  .back-link {
    text-align: center;
    font-size: 12px;
    color: var(--teal);
    margin-top: 14px;
    cursor: pointer;
  }
</style>

html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{width:100%;max-width:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

<body>

<div class="lang-toggle" id="langToggle">
  <span id="langFlag">🇬🇧</span><span class="lang-code" id="langCode">EN</span>
</div>

<div class="wrap">
  <div class="brand">
    <div class="brand-name">SOCCEREDGE<span class="premium">PRO</span></div>
    <div class="brand-sub" data-i18n="brandSub">PRO MATCH INTELLIGENCE</div>
  </div>

  <div style="border:1px solid #2dd4bf66;background:#2dd4bf12;color:#ccefe9;border-radius:12px;padding:12px;margin:0 0 18px;font-size:12px;line-height:1.5;text-align:center" data-i18n="betaNote">BETA · All features are free during beta.</div>

  <div class="tabs" id="tabsRow">
    <div class="tab active" data-mode="login" data-i18n="loginTab">Log In</div>
    <div class="tab" data-mode="register" data-i18n="registerTab">Sign Up</div>
  </div>

  <div class="card">
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <div id="mainFields">
      <div class="field-label" data-i18n="usernameLabel">Username</div>
      <input type="text" class="field-input" id="usernameInput" autocomplete="username">

      <div class="field-group" id="emailGroup">
        <div class="field-label" data-i18n="emailLabel">Email</div>
        <input type="email" class="field-input" id="emailInput" autocomplete="email">
      </div>

      <div class="field-group" id="birthDateGroup">
        <div class="field-label" data-i18n="birthDateLabel">Birth Year · 18+</div>
        <input type="number" class="field-input" id="birthYearInput" inputmode="numeric" min="1900" max="2008" step="1" placeholder="YYYY" autocomplete="bday-year">
      </div>

      <div class="field-label" data-i18n="passwordLabel">Password</div>
      <input type="password" class="field-input" id="passwordInput" autocomplete="current-password">
    </div>

    <div class="field-group" id="forgotFields">
      <div class="field-label" data-i18n="emailLabel">Email</div>
      <input type="email" class="field-input" id="forgotEmailInput" autocomplete="email">
    </div>

    <button class="submit-btn" id="submitBtn" data-i18n="loginBtn">Log In</button>

    <div class="forgot-link" id="forgotLink" data-i18n="forgotLink">Forgot password?</div>
    <div class="back-link" id="backLink" style="display:none;" data-i18n="backToLogin">Back to log in</div>
  </div>
  <button class="install-entry" id="installGuideBtn" type="button">📲 Soccer Edge’i cihazına ekle</button>
  <div class="login-legal">
    <div class="login-legal-links">
      <button type="button" onclick="location.href='privacy.html'">Privacy Policy</button>
      <button type="button" onclick="location.href='legal.html'">Legal Notice</button>
    </div>
    <div class="login-copyright">SoccerEdge Pro © 2026 · All rights reserved.</div>
  </div>
</div>

<div class="install-sheet" id="installSheet" aria-hidden="true">
  <div class="install-panel">
    <div class="install-head"><div class="install-title" id="installTitle">Soccer Edge’i cihazına ekle</div><button class="install-close" id="installClose" aria-label="Kapat">×</button></div>
    <div class="install-slide" id="installSlide"></div>
    <div class="install-dots" id="installDots"></div>
    <div class="install-actions"><button class="install-prev" id="installPrev">Geri</button><button class="install-next" id="installNext">İleri</button></div>
  </div>
</div>

<script>
const API_BASE = 'https://matchedge-backend-kujb.onrender.com';

const TRANSLATIONS = {
  en: {
    brandSub: 'PRO MATCH INTELLIGENCE', betaNote: 'BETA · All features are free during beta.', loginTab: 'Log In', registerTab: 'Sign Up',
    usernameLabel: 'Username', emailLabel: 'Email', passwordLabel: 'Password', birthDateLabel: 'Birth Year · 18+', ageError: 'You must be 18 or older to create an account.',
    loginBtn: 'Log In', registerBtn: 'Create Account', resetBtn: 'Send Reset Link',
    fillFields: 'Please fill in all fields.',
    connecting: 'Connecting...',
    backendMissing: 'Backend not connected yet - set API_BASE in this file first.',
    networkError: 'Could not reach the server. Check your connection.',
    forgotLink: 'Forgot password?', backToLogin: '← Back to log in',
    resetSent: 'If that email is registered, a reset link has been sent.',
    registerSuccess: 'Account created successfully.', installButton:'📲 Add Soccer Edge to your device', installTitle:'Add Soccer Edge to your device', installBack:'Back', installNext:'Next', installDone:'Done', installClose:'Close',
  },
  tr: {
    brandSub: 'PRO MAÇ ZEKASI', betaNote: 'BETA · Beta süresince tüm özellikler ücretsiz.', loginTab: 'Giriş Yap', registerTab: 'Kayıt Ol',
    usernameLabel: 'Kullanıcı Adı', emailLabel: 'E-posta', passwordLabel: 'Şifre', birthDateLabel: 'Doğum Yılı · 18+', ageError: 'Hesap oluşturmak için 18 yaşını doldurmuş olmalısın.',
    loginBtn: 'Giriş Yap', registerBtn: 'Hesap Oluştur', resetBtn: 'Sıfırlama Bağlantısı Gönder',
    fillFields: 'Lütfen tüm alanları doldur.',
    connecting: 'Bağlanıyor...',
    backendMissing: 'Backend henüz bağlanmadı - önce bu dosyadaki API_BASE değerini ayarla.',
    networkError: 'Sunucuya ulaşılamadı. Bağlantını kontrol et.',
    forgotLink: 'Şifremi unuttum', backToLogin: '← Girişe dön',
    resetSent: 'Eğer bu e-posta kayıtlıysa, bir sıfırlama bağlantısı gönderildi.',
    registerSuccess: 'Hesap başarıyla oluşturuldu.', installButton:'📲 Soccer Edge’i cihazına ekle', installTitle:'Soccer Edge’i cihazına ekle', installBack:'Geri', installNext:'İleri', installDone:'Bitti', installClose:'Kapat',
  },
};

let currentLang = localStorage.getItem('matchedge_lang') || 'en';
let currentMode = 'login'; // login | register | forgot

function t(key) { return (TRANSLATIONS[currentLang] || TRANSLATIONS.en)[key] ?? key; }

function applyStaticTranslations() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.getElementById('langFlag').textContent = currentLang === 'tr' ? '🇬🇧' : '🇹🇷';
  document.getElementById('langCode').textContent = currentLang === 'tr' ? 'EN' : 'TR';
  updateSubmitLabel();
  const ib=document.getElementById('installGuideBtn'); if(ib) ib.textContent=t('installButton');
  const it=document.getElementById('installTitle'); if(it) it.textContent=t('installTitle');
  const ip=document.getElementById('installPrev'); if(ip) ip.textContent=t('installBack');
  const ic=document.getElementById('installClose'); if(ic) ic.setAttribute('aria-label',t('installClose'));
  if(document.getElementById('installSheet')?.classList.contains('open')) renderInstall();
}

function updateSubmitLabel() {
  const btn = document.getElementById('submitBtn');
  if (currentMode === 'login') btn.textContent = t('loginBtn');
  else if (currentMode === 'register') btn.textContent = t('registerBtn');
  else btn.textContent = t('resetBtn');
}

document.getElementById('langToggle').addEventListener('click', () => {
  currentLang = currentLang === 'tr' ? 'en' : 'tr';
  localStorage.setItem('matchedge_lang', currentLang);
  applyStaticTranslations();
});

const installSheet=document.getElementById('installSheet');
let installStep=0;
function installPlatform(){
  const ua=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if(/Android/i.test(ua)) return 'android';
  return 'desktop';
}
function installSlides(){
  const p=installPlatform(), en=currentLang==='en';
  const intro=en
    ? {icon:'⚽',title:'Keep Soccer Edge at your fingertips',text:'Add Soccer Edge to your home screen and open it with one tap, just like an app.'}
    : {icon:'⚽',title:'Soccer Edge her zaman elinin altında',text:'Siteyi cihazının ana ekranına ekleyerek tek dokunuşla, uygulama gibi açabilirsin.'};
  const end=en
    ? {icon:'✓',title:'Ready',text:'Once added, Soccer Edge will appear on your home screen with its own shortcut.'}
    : {icon:'✓',title:'Hazır',text:'Ekledikten sonra Soccer Edge ana ekranında kendi kısayoluyla görünecek.'};
  if(p==='ios') return en
    ? [intro,{icon:'🧭',title:'Open in Safari',text:'Open Soccer Edge in Safari and tap the Share button in the bottom toolbar.'},{icon:'＋',title:'Add to Home Screen',text:'Choose “Add to Home Screen”, then tap “Add” in the top-right corner.'},end]
    : [intro,{icon:'🧭',title:'Safari’de aç',text:'Soccer Edge’i Safari’de aç. Alt menüdeki Paylaş simgesine dokun.'},{icon:'＋',title:'Ana Ekrana Ekle',text:'Menüden “Ana Ekrana Ekle” seçeneğine dokun, ardından sağ üstten “Ekle” de.'},end];
  if(p==='android') return en
    ? [intro,{icon:'⋮',title:'Open the Chrome menu',text:'In Chrome, tap the three-dot menu in the top-right corner.'},{icon:'📲',title:'Add to Home Screen',text:'Choose “Add to Home screen” or “Install app”, then confirm.'},end]
    : [intro,{icon:'⋮',title:'Chrome menüsünü aç',text:'Chrome’da sağ üstteki üç nokta menüsüne dokun.'},{icon:'📲',title:'Ana ekrana ekle',text:'“Ana ekrana ekle” veya “Uygulamayı yükle” seçeneğini seç ve onayla.'},end];
  return en
    ? [intro,{icon:'🌐',title:'Open in Chrome or Edge',text:'Open Soccer Edge in Chrome or Microsoft Edge.'},{icon:'💻',title:'Create a shortcut',text:'Use “Create shortcut” or the install option in your browser menu.'},end]
    : [intro,{icon:'🌐',title:'Chrome veya Edge’de aç',text:'Soccer Edge’i Chrome ya da Microsoft Edge ile aç.'},{icon:'💻',title:'Kısayol oluştur',text:'Tarayıcı menüsünden “Kısayol oluştur” seçeneğini kullan.'},end];
}
function renderInstall(){
  const slides=installSlides(),s=slides[installStep];
  document.getElementById('installSlide').innerHTML=`<div class="install-icon">${s.icon}</div><h3>${s.title}</h3><p>${s.text}</p>`;
  document.getElementById('installDots').innerHTML=slides.map((_,i)=>`<span class="install-dot ${i===installStep?'active':''}"></span>`).join('');
  document.getElementById('installPrev').style.visibility=installStep?'visible':'hidden';
  document.getElementById('installNext').textContent=installStep===slides.length-1?t('installDone'):t('installNext');
}
function openInstallGuide(){installStep=0;renderInstall();installSheet.classList.add('open');installSheet.setAttribute('aria-hidden','false')}
function closeInstallGuide(){installSheet.classList.remove('open');installSheet.setAttribute('aria-hidden','true');localStorage.setItem('socceredge_install_guide_seen','1')}
document.getElementById('installGuideBtn').addEventListener('click',openInstallGuide);
document.getElementById('installClose').addEventListener('click',closeInstallGuide);
document.getElementById('installPrev').addEventListener('click',()=>{if(installStep>0){installStep--;renderInstall()}});
document.getElementById('installNext').addEventListener('click',()=>{const slides=installSlides();if(installStep<slides.length-1){installStep++;renderInstall()}else closeInstallGuide()});
installSheet.addEventListener('click',e=>{if(e.target===installSheet)closeInstallGuide()});

function clearMessages() {
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('successMsg').classList.remove('show');
}

function setMode(mode) {
  currentMode = mode;
  clearMessages();

  document.getElementById('tabsRow').style.display = mode === 'forgot' ? 'none' : 'flex';
  document.getElementById('mainFields').style.display = mode === 'forgot' ? 'none' : 'block';
  document.getElementById('forgotFields').classList.toggle('visible', mode === 'forgot');
  document.getElementById('emailGroup').classList.toggle('visible', mode === 'register');
  document.getElementById('birthDateGroup').classList.toggle('visible', mode === 'register');
  document.getElementById('forgotLink').style.display = 'none';
  document.getElementById('backLink').style.display = mode === 'forgot' ? 'block' : 'none';

  updateSubmitLabel();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
    tab.classList.add('active');
    setMode(tab.dataset.mode);
  });
});

document.getElementById('forgotLink').addEventListener('click', () => setMode('forgot'));
document.getElementById('backLink').addEventListener('click', () => setMode('login'));

function showError(msg) {
  clearMessages();
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function showSuccess(msg) {
  clearMessages();
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.classList.add('show');
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  if (!API_BASE) {
    showError(t('backendMissing'));
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  try {
    if (currentMode === 'forgot') {
      const email = document.getElementById('forgotEmailInput').value.trim();
      if (!email) { showError(t('fillFields')); return; }

      btn.textContent = t('connecting');
      const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      await res.json();
      showSuccess(t('resetSent'));
      return;
    }

    const username = document.getElementById('usernameInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const email = document.getElementById('emailInput').value.trim();
    const birthYear = document.getElementById('birthYearInput').value.trim();

    if (!username || !password || (currentMode === 'register' && (!email || !birthYear))) {
      showError(t('fillFields'));
      return;
    }

    btn.textContent = t('connecting');
    const endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/register';
    const body = currentMode === 'login'
      ? { username, password, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '' }
      : { username, email, password, birthYear };

    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || t('networkError'));
      return;
    }

    localStorage.setItem('matchedge_token', data.token);
    localStorage.setItem('matchedge_username', data.username);
    const next=new URLSearchParams(location.search).get('next');
    window.location.href = next || 'ana-sayfa.html';
  } catch (err) {
    showError(t('networkError'));
  } finally {
    btn.disabled = false;
    updateSubmitLabel();
  }
});

applyStaticTranslations();
</script>

<script src="language-selector.js"></script>
</body>
</html>
