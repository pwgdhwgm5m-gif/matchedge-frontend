<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MatchEdge - Canlı Simülasyon</title>
<style>
  :root {
    --bg-base: #0a0e17;
    --bg-card: #121826;
    --bg-card-inner: #0d1220;
    --border-subtle: #1e2636;
    --teal: #2dd4bf;
    --purple: #9d7cf0;
    --amber: #f5b942;
    --red: #f0556b;
    --text-primary: #f2f4f8;
    --text-secondary: #8b93a7;
    --text-muted: #5a6478;
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
  }

  .app { max-width: 480px; margin: 0 auto; padding: 16px; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 4px 20px;
  }
  .brand-name { font-size: 19px; font-weight: 800; }
  .brand-name .premium { color: var(--teal); margin-left: 4px; }
  .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; margin-top: 2px; }

  .live-pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(240, 85, 107, 0.12);
    border: 1px solid rgba(240, 85, 107, 0.35);
    color: var(--red);
    font-size: 11px; font-weight: 700;
    padding: 6px 12px; border-radius: 20px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(240,85,107,0.6); }
    70% { box-shadow: 0 0 0 7px rgba(240,85,107,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,85,107,0); }
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px; font-weight: 700; letter-spacing: 1.2px;
    color: var(--text-secondary);
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 18px;
  }

  .minute-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 0 auto 18px;
    width: fit-content;
    background: rgba(240,85,107,0.1);
    border: 1px solid rgba(240,85,107,0.3);
    color: var(--red);
    font-weight: 800;
    font-size: 14px;
    padding: 6px 16px;
    border-radius: 20px;
  }
  .minute-badge .pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red);
    animation: pulse 1.2s infinite;
  }

  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .team { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 34%; }
  .team-crest {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--bg-card-inner);
    border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    overflow: hidden;
  }
  .team-crest img { width: 100%; height: 100%; object-fit: contain; }
  .team-name { font-size: 13.5px; font-weight: 700; text-align: center; }
  .score-block { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 800; }
  .score-dash { color: var(--text-muted); font-weight: 300; font-size: 22px; }

  .momentum-wrap { margin-top: 22px; }
  .momentum-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-secondary); margin-bottom: 8px;
  }
  .momentum-bar {
    display: flex; height: 10px; border-radius: 6px; overflow: hidden;
    background: var(--bg-card-inner);
  }
  .momentum-fill { transition: width 0.6s ease; }
  .momentum-fill.home { background: var(--teal); }
  .momentum-fill.away { background: var(--purple); }
  .momentum-caption {
    text-align: center; font-size: 10.5px; color: var(--text-muted); margin-top: 8px;
  }

  .xg-chart-wrap { position: relative; height: 140px; margin-top: 4px; }
  .xg-legend { display: flex; justify-content: center; gap: 16px; margin-bottom: 12px; font-size: 10.5px; color: var(--text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  #xgCanvas { width: 100%; height: 100%; display: block; }

  .xg-current-row {
    display: flex; justify-content: space-around; margin-top: 14px;
  }
  .xg-current { text-align: center; }
  .xg-current-value { font-size: 20px; font-weight: 800; }
  .xg-current-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

  .alert-card {
    background: rgba(245, 185, 66, 0.08);
    border: 1px solid rgba(245, 185, 66, 0.35);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
  }
  .alert-icon { font-size: 20px; }
  .alert-text { font-size: 12px; color: var(--text-primary); font-weight: 600; line-height: 1.4; }
  .alert-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .premium-tag {
    margin-left: auto;
    font-size: 9px;
    background: var(--amber);
    color: #1a1400;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .live-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .live-stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-card-inner);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 12px 14px;
    grid-column: span 2;
  }
  .live-stat-label { font-size: 11.5px; color: var(--text-secondary); flex: 1; text-align: center; }
  .live-stat-value { font-size: 15px; font-weight: 800; width: 30px; text-align: center; }
  .live-stat-value.home { color: var(--teal); }
  .live-stat-value.away { color: var(--purple); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card);
    border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-around;
    padding: 10px 0 20px;
  }
  .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--text-muted); }
  .nav-item.active { color: var(--teal); }
  .nav-icon { font-size: 18px; }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .lang-toggle {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
  }
  .lang-toggle .lang-code { font-size: 9.5px; font-weight: 800; color: var(--text-secondary); margin-left: 2px; }

  .error-state {
    text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;
  }
  .error-state .icon { font-size: 28px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="app">

  <div class="top-bar">
    <div>
      <div class="brand-name">MATCHEDGE<span class="premium">PREMIUM</span></div>
      <div class="brand-sub" data-i18n="brandSub">LIVE MATCH SIMULATOR</div>
    </div>
    <div class="top-actions">
      <div class="lang-toggle" id="langToggle">
        <span id="langFlag">🇬🇧</span><span class="lang-code" id="langCode">EN</span>
      </div>
      <div class="live-pill"><span class="live-dot"></span><span data-i18n="liveTag">LIVE</span></div>
    </div>
  </div>

  <div id="mainContent">

  <div class="card">
    <div class="minute-badge"><span class="pip"></span><span id="minute-text">–</span></div>
    <div class="score-row">

      </div>
    </div>

        <span data-i18n="possessionLabel">Possession</span>
        <span id="possession-away-label">Dep %–</span>
      </div>
      <div class="momentum-bar">
        <div class="momentum-fill home" id="possession-home" style="width:50%"></div>
        <div class="momentum-fill away" id="possession-away" style="width:50%"></div>
      </div>
      <div class="momentum-caption" data-i18n="possessionCaption">Real possession share from live data</div>
    </div>

    <div class="momentum-wrap">
      <div class="momentum-labels">
        <span id="momentum-home-label">Ev %–</span>
        <span data-i18n="pressureLabel">Pressure</span>
        <span id="momentum-away-label">Dep %–</span>
      </div>
      <div class="momentum-bar">
        <div class="momentum-fill home" id="momentum-home" style="width:50%"></div>
