<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Match Room</title><style>
:root{--bg:#0f1415;--card:#202526;--inner:#282e2f;--line:#414b4c;--teal:#39c7c1;--muted:#aebdb9;--amber:#d9ad58;--text:#f3f6f5;--red:#e66b64}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:18px}.app{max-width:480px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.back{border:1px solid var(--line);background:var(--card);color:var(--teal);border-radius:10px;padding:9px 12px;font-size:18px}.top-title{font-weight:950;letter-spacing:.5px}.sub{color:var(--muted);font-size:10px;margin-top:3px}.match-card,.rules-card,.chat-card{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.teams{font-size:18px;font-weight:950;line-height:1.25}.match-meta{color:var(--muted);font-size:10px;margin-top:7px}.room-label{color:var(--teal);font-size:11px;font-weight:950;letter-spacing:1px}.rules-card{background:#192c2d;border-color:#3c6867}.rules-title{font-size:12px;font-weight:950;color:var(--teal);margin-bottom:6px}.rules-text{font-size:10px;line-height:1.55;color:var(--text)}.rules-text b{color:var(--amber)}.rules-actions{display:flex;align-items:center;gap:8px;margin-top:10px}.rules-btn,.send{border:0;border-radius:10px;background:var(--teal);color:#102122;padding:10px 12px;font-weight:950}.rules-btn:disabled,.send:disabled{opacity:.5}.rules-status{font-size:10px;color:var(--muted)}.chat-card{padding:0;overflow:hidden}.feed{height:54vh;min-height:300px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.empty{text-align:center;color:var(--muted);margin:auto;font-size:12px}.bubble{max-width:88%;background:var(--inner);border:1px solid var(--line);border-radius:12px;padding:9px 11px;align-self:flex-start}.bubble.mine{align-self:flex-end;border-color:#347b78;background:#193b3b}.who{color:var(--teal);font-size:10px;font-weight:950}.text{font-size:13px;line-height:1.4;margin-top:4px;overflow-wrap:anywhere}.time{color:var(--muted);font-size:8px;margin-top:5px}.compose{display:flex;gap:7px;padding:9px;border-top:1px solid var(--line)}.compose input{flex:1;min-width:0;background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font-size:13px}.compose input::placeholder{color:#91a19d}.send{flex:0 0 auto}.error{min-height:18px;color:#ff9b9b;font-size:10px;padding:0 12px 8px}.hidden{display:none!important}@media(max-width:360px){.app{padding:12px}.teams{font-size:16px}}</style></head><body><main class="app"><header class="top"><button class="back" id="backBtn" type="button" aria-label="Geri">←</button><div><div class="top-title">MATCH ROOM</div><div class="sub">Bu maça ait sohbet odası</div></div></header><section class="match-card"><div class="teams" id="teams">Match</div><div class="match-meta" id="matchMeta"></div></section><section class="rules-card" id="rulesCard"><div class="rules-title">SOHBET KURALLARI</div><div class="rules-text">Küfür, hakaret, tehdit, nefret söylemi, spam, bağlantı ve iletişim bilgisi paylaşımı yasaktır. <b>Kurallara aykırı mesajlar engellenir; tekrar eden ihlallerde sohbet erişimi geçici olarak durdurulabilir.</b></div><div class="rules-actions"><button class="rules-btn" id="acceptRules" type="button">Kuralları kabul ediyorum</button><span class="rules-status" id="rulesStatus"></span></div></section><section class="chat-card"><div class="feed" id="feed"><div class="empty">Sohbet yükleniyor…</div></div><form class="compose" id="compose"><input id="messageInput" maxlength="280" autocomplete="off" placeholder="Bu maç hakkında yaz…" disabled><button class="send" id="sendBtn" type="submit" disabled>Gönder</button></form><div class="error" id="error"></div></section></main><script>
const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),headers={Authorization:'Bearer '+token,'Content-Type':'application/json'},query=new URLSearchParams(location.search),fixtureId=query.get('fixtureId')||query.get('id')||'';if(!token)location.href='giris.html';const teams=document.getElementById('teams'),matchMeta=document.getElementById('matchMeta'),feed=document.getElementById('feed'),rulesCard=document.getElementById('rulesCard'),acceptRules=document.getElementById('acceptRules'),rulesStatus=document.getElementById('rulesStatus'),input=document.getElementById('messageInput'),sendBtn=document.getElementById('sendBtn'),compose=document.getElementById('compose'),errorEl=document.getElementById('error');teams.textContent=(query.get('home')||'Home')+' – '+(query.get('away')||'Away');matchMeta.textContent=[query.get('league'),query.get('kickoff')].filter(Boolean).join(' · ');document.getElementById('backBtn').addEventListener('click',()=>history.back());let rulesAccepted=false,loading=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=s=>{const d=new Date(s);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};function setComposer(){const enabled=rulesAccepted&&!loading;input.disabled=!enabled;sendBtn.disabled=!enabled;rulesCard.classList.toggle('hidden',rulesAccepted);if(rulesAccepted){rulesStatus.textContent='Kurallar kabul edildi';rulesStatus.style.color='var(--teal)'}}function render(rows){feed.innerHTML=rows.length?rows.map(x=>'<article class="bubble '+(x.mine?'mine':'')+'"><div class="who">@'+esc(x.authorName||'kullanıcı')+'</div><div class="text">'+esc(x.text)+'</div><div class="time">'+time(x.createdAt)+'</div></article>').join(''):'<div class="empty">Bu maçın sohbeti henüz boş. İlk mesajı sen yaz.</div>';feed.scrollTop=feed.scrollHeight}async function load(){if(!fixtureId){errorEl.textContent='Maç kimliği bulunamadı.';return}try{const r=await fetch(API+'/api/messages/match/'+encodeURIComponent(fixtureId),{headers}),d=await r.json();if(!r.ok)throw Error(d.error||'Sohbet yüklenemedi.');rulesAccepted=Boolean(d.rulesAccepted);if(d.suspendedUntil){errorEl.textContent='Sohbet erişimin geçici olarak durduruldu.';rulesAccepted=false;acceptRules.disabled=true}render(d.messages||[]);setComposer()}catch(e){errorEl.textContent=e.message}}async function accept(){acceptRules.disabled=true;try{const r=await fetch(API+'/api/messages/match/'+encodeURIComponent(fixtureId)+'/rules',{method:'POST',headers,body:JSON.stringify({accepted:true})}),d=await r.json();if(!r.ok)throw Error(d.error||'Kurallar kabul edilemedi.');rulesAccepted=true;rulesStatus.textContent='Kurallar kabul edildi';setComposer()}catch(e){rulesStatus.textContent=e.message;acceptRules.disabled=false}}async function send(e){e.preventDefault();const text=input.value.trim();if(!text||loading)return;errorEl.textContent='';loading=true;setComposer();try{const r=await fetch(API+'/api/messages/match/'+encodeURIComponent(fixtureId),{method:'POST',headers,body:JSON.stringify({text,acceptedRules:rulesAccepted})}),d=await r.json();if(!r.ok)throw Error(d.error||'Mesaj gönderilemedi.');input.value='';await load()}catch(e){errorEl.textContent=e.message}finally{loading=false;setComposer()}}acceptRules.addEventListener('click',accept);compose.addEventListener('submit',send);load();setInterval(load,8000);
</script></body></html>
