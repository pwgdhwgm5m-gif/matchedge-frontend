<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Match Room</title><style>:root{--bg:#061b3a;--card:#0b2b59;--line:#244b79;--gold:#f2c94c;--muted:#a9bbd6;--green:#35c878}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#092957,#061b3a);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center}.back{background:var(--card);border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:9px 12px}.card{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.teams{font-size:17px;font-weight:950}.sub{color:var(--muted);font-size:10px}.consensus{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.cell{background:#09244b;border-radius:10px;padding:10px;text-align:center}.cell b{display:block;color:var(--gold);font-size:17px}.cell span{font-size:8px;color:var(--muted)}.pick{border-top:1px solid var(--line);padding:10px 0}.pick:first-child{border-top:0}.pickline{display:flex;justify-content:space-between}.agree{color:var(--green);font-weight:900}.feed{height:42vh;overflow:auto}.bubble{background:#09244b;border-radius:10px;padding:9px;margin:7px 0}.who{color:var(--gold);font-weight:900;font-size:10px}.compose{display:flex;gap:7px}.compose input{flex:1;min-width:0;background:#09244b;border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff}.compose button{border:0;background:var(--gold);border-radius:10px;font-weight:900}</style></head><body><main class="app"><header class="top"><button class="back" onclick="history.back()">←</button><div><b>MATCH ROOM</b><div class="sub">AI · Community · Experts · Chat</div></div></header><section class="card"><div class="teams" id="teams">Match</div><div class="sub" id="league"></div><div id="summary"></div></section><section class="card"><b>COMMUNITY CONSENSUS</b><div id="consensus" class="sub" style="margin-top:8px">Loading…</div></section><section class="card"><b>ROOM CHAT</b><div class="feed" id="feed"><div class="sub">Loading…</div></div><form class="compose" id="form"><input id="input" maxlength="280" placeholder="Talk about this match…"><button>SEND</button></form></section></main><script>
const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+token,'Content-Type':'application/json'},q=new URLSearchParams(location.search),fixtureId=q.get('fixtureId')||q.get('id');if(!token)location.href='giris.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));teams.textContent=(q.get('home')||'Home')+' – '+(q.get('away')||'Away');league.textContent=q.get('league')||'';async function loadConsensus(){if(!fixtureId){consensus.textContent='Fixture ID unavailable.';return}const r=await fetch(API+'/api/community/fixture/'+encodeURIComponent(fixtureId)+'/consensus',{headers:H}),d=await r.json();consensus.innerHTML=(d.selections||[]).slice(0,6).map(x=>'<div class="pick"><div class="pickline"><b>'+esc(x.label)+'</b><span>'+esc(x.market)+'</span></div><div class="consensus"><div class="cell"><b>'+x.communityPercent+'%</b><span>COMMUNITY</span></div><div class="cell"><b>'+x.expertPercent+'%</b><span>EXPERTS</span></div><div class="cell"><b>'+x.community+'</b><span>VERIFIED PICKS</span></div></div></div>').join('')||'No verified picks yet.'}async function loadChat(){if(!fixtureId)return;const r=await fetch(API+'/api/messages/match/'+encodeURIComponent(fixtureId),{headers:H}),d=await r.json();feed.innerHTML=(d.messages||[]).map(m=>'<div class="bubble"><div class="who" onclick="location.href=\'social-profile.html?u='+encodeURIComponent(m.authorName)+'\'">@'+esc(m.authorName)+' · '+esc(m.rank?.icon||'')+' '+esc(m.rank?.name||'')+'</div><div>'+esc(m.text)+'</div></div>').join('')||'<div class="sub">No messages yet. Start the match discussion.</div>'}form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||!fixtureId)return;const r=await fetch(API+'/api/messages/match/'+encodeURIComponent(fixtureId),{method:'POST',headers:H,body:JSON.stringify({text})});if(r.ok){input.value='';loadChat()}else{const d=await r.json();alert(d.error||'Message not sent')}};loadConsensus();loadChat();setInterval(loadChat,5000)</script></body></html>
