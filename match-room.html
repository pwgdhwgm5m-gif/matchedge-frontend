<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Match Room</title><script>(function(){document.documentElement.setAttribute("data-theme","dark")})();</script><style>:root{--bg:#0f1415;--card:#171d1e;--line:#364142;--gold:#d9ad58;--muted:#a9bbd6;--green:#35c878}*{box-sizing:border-box}body{margin:0;background:#0f1415;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center}.back{background:var(--card);border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:9px 12px}.card{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}.teams{font-size:17px;font-weight:950}.sub{color:var(--muted);font-size:10px}.consensus{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.cell{background:#09244b;border-radius:10px;padding:10px;text-align:center}.cell b{display:block;color:var(--gold);font-size:17px}.cell span{font-size:8px;color:var(--muted)}.aihero{border-color:#35c878}.aihero .big{font-size:21px;font-weight:950;color:#35c878;margin-top:6px}.history{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.history div{background:#09244b;border-radius:9px;padding:8px}.history b{display:block;color:#fff}.edgeid{margin-top:7px;font:8px monospace;color:var(--muted);word-break:break-all}.share{margin-top:8px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:7px;font-weight:900;font-size:9px}.pick{border-top:1px solid var(--line);padding:10px 0}.pick:first-child{border-top:0}.pickline{display:flex;justify-content:space-between}.my-pick-btn{margin-top:7px;border:1px solid #27d89a;background:rgba(39,216,154,.1);color:#7ff0c6;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:950}.my-pick-btn:disabled{opacity:.55}.agree{color:var(--green);font-weight:900}.signal{margin-top:7px;padding:7px;border-radius:8px;font-size:9px;font-weight:950;text-align:center}.strong{color:#35c878;background:rgba(53,200,120,.09);border:1px solid rgba(53,200,120,.3)}.disagree{color:#d9ad58;background:rgba(242,201,76,.08);border:1px solid rgba(242,201,76,.28)}.feed{height:42vh;overflow:auto}.bubble{background:#09244b;border-radius:10px;padding:9px;margin:7px 0}.who{color:var(--gold);font-weight:900;font-size:10px}.compose{display:flex;gap:7px}.compose input{flex:1;min-width:0;background:#09244b;border:1px solid var(--line);border-radius:10px;padding:11px;color:#fff}.compose button{border:0;background:var(--gold);border-radius:10px;font-weight:900}</style><style>

</head><body><main class="app"><header class="top"><button class="back" onclick="history.back()">←</button><div><b>MATCH ROOM</b><div class="sub">AI · Community · Experts</div></div></header><section class="card"><div class="teams" id="teams">Match</div><div class="sub" id="league"></div><div id="summary"></div></section><section class="card aihero"><b>SOCCEREDGE AI</b><div class="big" id="aiStrongest">Loading AI selection…</div><div class="sub" id="aiDetail">AI analysis remains the primary decision layer.</div><div class="edgeid" id="aiEdgeId">EDGE ID · loading</div></section><section class="card"><b>COMMUNITY · EXPERTS</b><div id="consensus" class="sub" style="margin-top:8px">Loading…</div></section></main><script>
const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+token,'Content-Type':'application/json'},q=new URLSearchParams(location.search),fixtureId=q.get('fixtureId')||q.get('id');if(!token)location.href='giris.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));teams.textContent=(q.get('home')||'Home')+' – '+(q.get('away')||'Away');league.textContent=q.get('league')||'';let aiMarkets=[];try{aiMarkets=JSON.parse(q.get('aiMarkets')||'[]')}catch(_){aiMarkets=[]}
async function loadAiTrust(){if(!fixtureId)return;try{const rr=await fetch(API+'/api/analysis/'+encodeURIComponent(fixtureId)+'/report-card',{headers:H}),d=rr.ok?await rr.json():{},o=d.modelHistory?.overall,l=d.modelHistory?.league;let p=d.strongestPick;const params=new URLSearchParams();if(q.get('home'))params.set('homeTeamName',q.get('home'));if(q.get('away'))params.set('awayTeamName',q.get('away'));if(q.get('league'))params.set('leagueName',q.get('league'));if(q.get('kickoff'))params.set('kickoff',q.get('kickoff'));const ar=await fetch(API+'/api/analysis/'+encodeURIComponent(fixtureId)+'?'+params.toString());if(ar.ok){const a=await ar.json();const markets=[a?.marketBoard?.best,...(a?.marketBoard?.topPredictions||[]),...(a?.marketBoard?.allMarkets||[])].filter(x=>x&&x.label&&Number.isFinite(Number(x.probability)));aiMarkets=markets.map(x=>({key:x.key,market:x.market,label:x.label,probability:Number(x.probability)}));if(!p)p=markets.sort((x,y)=>Number(y.probability)-Number(x.probability))[0]||null}if(p&&!aiMarkets.some(x=>String(x.key)===String(p.key)&&String(x.market)===String(p.market)))aiMarkets.push({key:p.key,market:p.market,label:p.label,probability:Number(p.probability)});aiStrongest.textContent=p?(p.label||p.key)+' · '+Math.round(Number(p.probability||0))+'%':'AI analysis collecting';aiEdgeId.textContent=d.edgeId?'EDGE ID · '+d.edgeId+' · '+String(d.status).toUpperCase():'EDGE ID · awaiting locked snapshot';aiDetail.textContent=d.result&&d.result!=='pending'?'Result · '+String(d.result).toUpperCase():'AI analysis remains the primary decision layer.'}catch(e){aiStrongest.textContent='AI analysis collecting';aiDetail.textContent='Model analysis is being prepared.'}}
function aiFor(x){const a=aiMarkets.find(m=>String(m.key)===String(x.key)&&String(m.market)===String(x.market));return a&&Number.isFinite(Number(a.probability))?Math.round(Number(a.probability)):null}
let myLockedPick=null;
async function loadMyPick(){if(!fixtureId)return;try{const r=await fetch(API+'/api/community/verified-picks/'+encodeURIComponent(fixtureId)+'/mine',{headers:H});if(r.ok){const d=await r.json();myLockedPick=(d.picks||[])[0]||null}}catch(_){myLockedPick=null}}
function myPickButton(x){if(myLockedPick){const mine=String(myLockedPick.key)===String(x.key);return '<button class="my-pick-btn" disabled>'+(mine?'✓ MY PICK · LOCKED':'MY PICK · LOCKED')+'</button>'}return '<button class="my-pick-btn" onclick="lockPick('+JSON.stringify(String(x.key))+','+JSON.stringify(String(x.market))+','+JSON.stringify(String(x.label))+')">MY PICK</button>'}
function consensusSignal(ai,c,e){const vals=[ai,c,e].filter(v=>Number.isFinite(v));if(vals.length<3)return '';const max=Math.max(...vals),min=Math.min(...vals);if(max-min<=10&&min>=55)return '<div class="signal strong">🔥 STRONG CONSENSUS</div>';if(max-min>=20)return '<div class="signal disagree">⚠ DISAGREEMENT</div>';return ''}
async function loadConsensus(){if(!fixtureId){consensus.textContent='Fixture ID unavailable.';return}await loadMyPick();const r=await fetch(API+'/api/community/fixture/'+encodeURIComponent(fixtureId)+'/consensus',{headers:H}),d=await r.json();consensus.innerHTML=(d.selections||[]).slice(0,12).map(x=>{const ai=aiFor(x),cp=Number(x.communityPercent)||0,ep=Number(x.expertPercent)||0;return '<div class="pick"><div class="pickline"><b>'+esc(x.label)+'</b><span>'+esc(x.market)+'</span></div><div class="consensus"><div class="cell"><b>'+(ai==null?'–':ai+'%')+'</b><span>AI</span></div><div class="cell"><b>'+cp+'%</b><span>COMMUNITY · '+x.community+'</span></div><div class="cell"><b>'+(x.expertMarketTotal?ep+'%':'–')+'</b><span>EXPERTS · '+x.experts+'</span></div></div>'+consensusSignal(ai,cp,x.expertMarketTotal?ep:NaN)+myPickButton(x)+'</div>'}).join('')||'No picks yet.'}
async function lockPick(key,market,label){const body={fixtureId,key,market,label,source:'match-room',homeTeam:q.get('home')||'Home',awayTeam:q.get('away')||'Away',league:q.get('league')||'',kickoff:q.get('kickoff')||null};const r=await fetch(API+'/api/community/verified-picks',{method:'POST',headers:H,body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.error||'Pick could not be locked');myLockedPick=d.pick||null;loadConsensus()}loadAiTrust().then(loadConsensus);</script><script src="global-slip.js"></script></body></html>
