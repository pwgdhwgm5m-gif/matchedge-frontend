<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>SoccerEdge Pro - Kuponum</title><style>
:root{--bg:#0a0e17;--card:#121826;--inner:#0d1220;--line:#1e2636;--teal:#2dd4bf;--amber:#f5b942;--red:#f0556b;--green:#4ade80;--text:#f2f4f8;--muted:#9aa4b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:92px}.app{max-width:480px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-weight:900;font-size:19px}.brand span{color:var(--teal)}.sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:3px}.refresh{border:1px solid var(--teal);background:rgba(45,212,191,.1);color:var(--teal);border-radius:11px;padding:10px 12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}.stat strong{font-size:19px;display:block}.stat span{font-size:9px;color:var(--muted)}.coupon{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}.coupon-head{display:flex;justify-content:space-between;gap:10px}.teams{font-weight:850;font-size:14px}.meta{color:var(--muted);font-size:10px;margin-top:4px}.score{font-weight:900;color:var(--amber)}.pick{display:flex;justify-content:space-between;gap:10px;background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:12px}.pick small{color:var(--muted);display:block;margin-bottom:3px}.badge{font-size:9px;font-weight:900;border-radius:8px;padding:5px 7px;height:max-content}.pending{color:var(--amber);border:1px solid var(--amber)}.won{color:var(--green);border:1px solid var(--green)}.lost{color:var(--red);border:1px solid var(--red)}.delete{margin-top:10px;border:0;background:transparent;color:var(--muted);font-size:11px}.empty{text-align:center;color:var(--muted);padding:50px 20px}.bottom{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;max-width:460px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;padding:9px 5px}.bottom a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:10px;padding:9px 2px}.bottom a.active{color:var(--teal)}
</style></head><body><main class="app"><div class="top"><div><div class="brand">MATCHEDGE <span>PREMIUM</span></div><div class="sub">KUPONUM</div></div><button class="refresh" id="refresh">Sonuçları kontrol et</button></div><div class="stats"><div class="stat"><strong id="pending">0</strong><span>BEKLİYOR</span></div><div class="stat"><strong id="won">0</strong><span>TUTTU</span></div><div class="stat"><strong id="lost">0</strong><span>TUTMADI</span></div></div><div id="list"><div class="empty">Kuponlar yükleniyor…</div></div></main><nav class="bottom"><a href="ana-sayfa.html">Ana Sayfa</a><a href="maclar.html">Maçlar</a><a href="mac-sonuclari.html">Sonuçlar</a><a class="active" href="kuponum.html">Kuponum</a><a href="favoriler.html">Favoriler</a></nav><script>
if(!localStorage.getItem('matchedge_token'))location.href='giris.html';const API='https://matchedge-backend-kujb.onrender.com';const headers=()=>({Authorization:`Bearer ${localStorage.getItem('matchedge_token')}`});const safe=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const statusText={pending:'Bekliyor',won:'Tuttu',lost:'Tutmadı',void:'Geçersiz'};
async function load(){const r=await fetch(`${API}/api/coupons`,{headers:headers()});if(r.status===401){location.href='giris.html';return}const d=await r.json();const coupons=d.coupons||[];for(const key of ['pending','won','lost'])document.getElementById(key).textContent=coupons.filter(c=>c.status===key).length;document.getElementById('list').innerHTML=coupons.length?coupons.map(c=>`<article class="coupon"><div class="coupon-head"><div><div class="teams">${safe(c.homeTeam)} - ${safe(c.awayTeam)}</div><div class="meta">${safe(c.league||'')} · ${c.kickoff?new Date(c.kickoff).toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}</div></div><div class="score">${c.finalScore?.home!=null?`${c.finalScore.home}-${c.finalScore.away}`:'—'}</div></div>${(c.selections||[]).map(s=>`<div class="pick"><div><small>${safe(s.market)}</small><strong>${safe(s.label)} ${s.probability?`· %${s.probability}`:''}</strong></div><span class="badge ${s.result}">${statusText[s.result]||'Bekliyor'}</span></div>`).join('')}<button class="delete" onclick="removeCoupon('${c._id}')">Kuponu sil</button></article>`).join(''):'<div class="empty">Henüz kupon yok.<br>Bir maç analizinden seçim yapabilirsin.</div>'}
async function removeCoupon(id){if(!confirm('Kupon silinsin mi?'))return;await fetch(`${API}/api/coupons/${id}`,{method:'DELETE',headers:headers()});load()}document.getElementById('refresh').onclick=async()=>{const b=document.getElementById('refresh');b.disabled=true;b.textContent='Kontrol ediliyor…';await fetch(`${API}/api/coupons/settle`,{method:'POST',headers:headers()});b.disabled=false;b.textContent='Sonuçları kontrol et';load()};load();
</script></body></html>
