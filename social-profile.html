<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Analyst Profile</title><style>
:root{--bg:#061b3a;--card:#0b2b59;--inner:#09244b;--line:#244b79;--gold:#f2c94c;--text:#f7f9fd;--muted:#b9c7dc;--green:#35c878;--red:#ef5350}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:16px 16px 100px}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--gold);font-size:22px}.title{font-weight:950}.sub{font-size:10px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}.hero{background:linear-gradient(145deg,#0d315f,#09244b)}.userline{display:flex;justify-content:space-between;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#061b3a;border:2px solid var(--tier,#9aa4b8);font-size:20px;font-weight:950}.identity{display:flex;gap:11px;align-items:center}.name{font-size:19px;font-weight:950}.tier{font-size:10px;font-weight:900;color:var(--tier,#9aa4b8);margin-top:4px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:15px}.stat{background:#071d3d;border-radius:11px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:8px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:13px}.btn{flex:1;border:1px solid var(--gold);background:var(--gold);color:#061b3a;border-radius:10px;padding:10px;font-weight:900}.btn.secondary{background:transparent;color:var(--gold)}.section-title{font-size:11px;font-weight:950;letter-spacing:.7px;margin-bottom:10px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--inner);border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:10px}.pick{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.pick:first-of-type{border-top:0}.pick b{font-size:11px}.pick small{display:block;color:var(--muted);margin-top:3px}.result{font-weight:950}.void{color:var(--muted)}.pickcard{padding:11px 0;border-top:1px solid var(--line)}.pickcard:first-of-type{border-top:0}.picktop{display:flex;justify-content:space-between;gap:8px}.pickactions{display:flex;gap:7px;margin-top:7px}.pickactions a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px;color:#fff;font-size:8px;font-weight:900}.won{color:var(--green)}.lost{color:var(--red)}.pending{color:var(--gold)}.search{display:flex;gap:7px}.search input{flex:1;min-width:0;background:var(--inner);border:1px solid var(--line);border-radius:10px;padding:11px;color:white}.search button{border:0;border-radius:10px;background:var(--gold);font-weight:900}.people{margin-top:9px}.person{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}.person small{color:var(--muted)}</style><link rel="stylesheet" href="premium-theme.css?v=20260921a"><style id="analyst-profile-dark-fix">
html,body,.app{background:#121718!important;color:#f3f6f5!important}
.card,.hero{background:#202526!important;background-image:none!important;border-color:#465253!important;color:#f3f6f5!important}
.title,.name,.section-title,.pickcard b,.person b{color:#f3f6f5!important}
.sub,.pickcard small,.person small{color:#aebdb9!important}
.section-title{color:#35c7bf!important}
.search input{background:#1a2021!important;border-color:#465253!important;color:#f3f6f5!important}
.search input::placeholder{color:#91a09d!important}
.search button{background:#ef6a63!important;color:#fff!important;border:1px solid #ef6a63!important}
.stat{background:#1a2021!important;border:1px solid #465253!important;color:#f3f6f5!important}
.stat b{color:#f3f6f5!important}.stat span{color:#aebdb9!important}
.avatar{background:#172337!important;color:#f3f6f5!important}
.chip{background:#1a2021!important;border-color:#465253!important;color:#f3f6f5!important}
.pickcard{border-color:#465253!important;color:#f3f6f5!important}
.pickactions a{background:#1a2021!important;border-color:#465253!important;color:#f3f6f5!important}
.pending{color:#c6a8ef!important}.won{color:#35c878!important}.lost{color:#ef6a63!important}
.back{background:#202526!important;border-color:#465253!important;color:#c6a8ef!important}
</style><style id="analyst-profile-mobile-fix">
.search{background:#202526!important}
.search input{border-radius:10px 0 0 10px!important;border-right:0!important}
.search button{margin-left:0!important;border-radius:0 10px 10px 0!important;background:#ef6a63!important;border:1px solid #ef6a63!important;color:#fff!important}
.picktop{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:12px!important;align-items:start!important}
.picktop>div{min-width:0!important;overflow:hidden!important}
.picktop b{display:block!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important;line-height:1.28!important;padding-right:2px!important}
.picktop small{display:block!important;white-space:normal!important;overflow-wrap:anywhere!important;line-height:1.45!important;margin-top:5px!important}

@media(max-width:420px){.picktop{grid-template-columns:minmax(0,1fr) 82px!important;gap:8px!important}.picktop .result{font-size:13px!important}}
</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">‹</button><div><div class="title">ANALYST PROFILE</div><div class="sub">Picks · friends · performance</div></div></div><section class="card"><div class="section-title">FIND ANALYSTS</div><div class="search"><input id="search" placeholder="Search username"><button onclick="findUsers()">Search</button></div><div class="people" id="people"></div></section><div id="profile"><div class="card">Loading profile…</div></div><div id="friendsPanel"></div></main><script>
const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token');if(!token)location.href='giris.html';const H={Authorization:'Bearer '+token,'Content-Type':'application/json'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null;
function initials(n){return String(n||'?').slice(0,2).toUpperCase()}function followButton(d){if(d.relationship==='self')return '';return '<button class="btn secondary" onclick="toggleFollow()">'+(d.isFollowing?'Following ✓':'+ Follow')+'</button>'}
function relationshipButton(d){if(d.relationship==='self')return '';if(d.relationship==='friends')return '<button class="btn secondary" onclick="removeFriend()">Friends ✓</button>';if(d.relationship==='requested')return '<button class="btn secondary" disabled>Request sent</button>';if(d.relationship==='incoming')return '<button class="btn" onclick="acceptFriend()">Accept friend</button>';return '<button class="btn" onclick="addFriend()">+ Add friend</button>'}
async function load(username){const path=username?'/api/community/profile/'+encodeURIComponent(username):'/api/community/me';const r=await fetch(API+path,{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Profile unavailable');if(!username){location.replace('social-profile.html?u='+encodeURIComponent(d.profile.username));return}current=d;render(d)}
async function loadFriends(){try{const r=await fetch(API+'/api/community/friends',{headers:H}),d=await r.json();if(!r.ok)return;const req=(d.requests||[]).map(u=>'<div class="person"><div onclick="location.href=\'social-profile.html?u='+encodeURIComponent(u.username)+'\'"><b>@'+esc(u.username)+'</b><small> · friend request</small></div><button class="btn" style="flex:0 0 auto;padding:7px 9px" onclick="action(\'/api/community/friends/'+u.id+'/accept\')">Accept</button></div>').join(''),friends=(d.friends||[]).map(u=>'<div class="person" onclick="location.href=\'social-profile.html?u='+encodeURIComponent(u.username)+'\'"><div><b>@'+esc(u.username)+'</b><small> · '+esc(u.analystTier?.name||'Rookie')+'</small></div><span>'+u.accuracy+'%</span></div>').join('');document.getElementById('friendsPanel').innerHTML='<section class="card"><div class="section-title">FRIENDS & REQUESTS</div>'+(req||'')+(friends||'<div class="sub">No friends yet. Search analysts above.</div>')+'</section>'}catch(_){}}
function render(d){const p=d.profile,t=p.analystTier||{name:'Rookie',color:'#9aa4b8'},markets=(d.bestMarkets||[]).map(x=>'<span class="chip">'+esc(x.name)+' · '+x.accuracy+'% <small>('+x.total+')</small></span>').join(''),leagues=(d.bestLeagues||[]).map(x=>'<span class="chip">'+esc(x.name)+' · '+x.accuracy+'%</span>').join(''),recent=(d.recent||[]).map(x=>{const rt=x.result==='won'?'✓ WON':x.result==='lost'?'✕ LOST':x.result==='void'?'— VOID':'⧗ PENDING',room='match-room.html?fixtureId='+encodeURIComponent(x.fixtureId)+'&home='+encodeURIComponent(x.homeTeam||'')+'&away='+encodeURIComponent(x.awayTeam||'')+'&league='+encodeURIComponent(x.league||'')+'&kickoff='+encodeURIComponent(x.kickoff||'');return '<div class="pickcard"><div class="picktop"><div><b>'+esc(x.homeTeam)+' – '+esc(x.awayTeam)+'</b><small>'+esc(x.market)+' · '+esc(x.label)+' · '+esc(x.league)+'</small></div><span class="result '+x.result+'">'+rt+'</span></div><div class="pickactions"><a href="'+room+'">MATCH ROOM</a></div></div>'}).join('');document.getElementById('profile').innerHTML='<section class="card hero" style="--tier:'+t.color+'"><div class="userline"><div class="identity"><div class="avatar">'+initials(p.username)+'</div><div><div class="name">@'+esc(p.username)+'</div><div class="tier">● '+esc(t.name)+' · '+esc(p.rank?.icon||'')+' '+esc(p.rank?.name||'')+'</div></div></div></div><div class="stats"><div class="stat"><b>'+p.accuracy+'%</b><span>ACCURACY</span></div><div class="stat"><b>'+p.totalPicks+'</b><span>PICKS</span></div><div class="stat"><b>'+p.currentStreak+'</b><span>STREAK</span></div><div class="stat"><b>'+p.friendsCount+'</b><span>FRIENDS</span></div></div><div class="actions">'+relationshipButton(d)+''+'</div></section><section class="card"><div class="section-title">SPECIALIST SIGNALS</div><div class="chips">'+(markets||'<span class="sub">Not enough settled picks yet.</span>')+'</div></section><section class="card"><div class="section-title">BEST LEAGUES</div><div class="chips">'+(leagues||'<span class="sub">Not enough league history yet.</span>')+'</div></section></div><div id="picks" class="tab-pane"><section class="card"><div class="section-title">PICK HISTORY</div>'+(recent||'<div class="sub">No picks yet.</div>')+'</section>';if(d.relationship==='self')loadFriends();else document.getElementById('friendsPanel').innerHTML=''}
async function action(path,method='POST'){const r=await fetch(API+path,{method,headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Action failed');load(current.profile.username)}
function tab(id,b){document.querySelectorAll('.tab-pane').forEach(x=>x.classList.add('hide'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.remove('hide');b.classList.add('active')}function toggleFollow(){action('/api/community/follow/'+current.profile.id,current.isFollowing?'DELETE':'POST')}function addFriend(){action('/api/community/friends/'+current.profile.id+'/request')}function acceptFriend(){action('/api/community/friends/'+current.profile.id+'/accept')}function removeFriend(){if(confirm('Remove friend?'))action('/api/community/friends/'+current.profile.id,'DELETE')}
async function findUsers(){const q=document.getElementById('search').value.trim();if(q.length<2)return;const r=await fetch(API+'/api/community/users/search?q='+encodeURIComponent(q),{headers:H}),d=await r.json();document.getElementById('people').innerHTML=(d.users||[]).map(u=>'<div class="person" onclick="location.href=\'social-profile.html?u='+encodeURIComponent(u.username)+'\'"><div><b>@'+esc(u.username)+'</b><small> · '+esc(u.analystTier?.name||'Rookie')+'</small></div><span>'+u.accuracy+'%</span></div>').join('')||'<div class="sub">No users found.</div>'}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')findUsers()});load(new URLSearchParams(location.search).get('u')).catch(e=>document.getElementById('profile').innerHTML='<div class="card">'+esc(e.message)+'</div>');
</script><script src="global-slip.js"></script></body></html>
