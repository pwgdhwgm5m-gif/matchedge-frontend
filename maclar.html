<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MatchEdge - Maçlar</title>
<style>
  :root {
    --bg-base: #0a0e17;
    --bg-card: #121826;
    --bg-card-inner: #0d1220;
    --border-subtle: #1e2636;
    --teal: #2dd4bf;
    --purple: #9d7cf0;
    --amber: #f5b942;
    --red: #f0556b;
    --text-primary: #f2f4f8;
    --text-secondary: #a8b0c2;
    --text-muted: #6b7386;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
    overflow-x: hidden;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 4px 18px;
  }
  .brand-name { font-size: 19px; font-weight: 800; }
  .brand-name .premium { color: var(--teal); margin-left: 4px; }
  .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; margin-top: 2px; }

  .day-tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 18px; scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 10px 14px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 12px; min-width: 56px; cursor: pointer;
  }
  .day-tab.active { background: rgba(45,212,191,0.12); border-color: var(--teal); }
  .day-tab .dow { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
  .day-tab.active .dow { color: var(--teal); }
  .day-tab .dnum { font-size: 15px; font-weight: 800; }

  .section-title {
    font-size: 12px; font-weight: 800; letter-spacing: 1px;
    color: var(--text-primary);
    margin: 4px 0 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title .badge {
    font-size: 9.5px; font-weight: 700; color: var(--teal);
    background: rgba(45,212,191,0.12);
    padding: 2px 8px; border-radius: 8px;
  }

  .league-group {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .league-group.priority { border-color: rgba(45,212,191,0.3); }
  .league-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    cursor: pointer;
  }
  .league-header-left { display: flex; flex-direction: column; gap: 2px; }
  .league-name { font-size: 13.5px; font-weight: 700; }
  .league-meta { font-size: 10.5px; color: var(--text-secondary); font-weight: 500; }
  .league-chevron {
    font-size: 12px; color: var(--text-secondary);
    transition: transform 0.2s ease;
    flex-shrink: 0; margin-left: 10px;
  }
  .league-group.expanded .league-chevron { transform: rotate(90deg); color: var(--teal); }

  .league-matches {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .league-group.expanded .league-matches {
    max-height: 3000px;
  }

  .match-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 16px;
    border-top: 1px solid var(--border-subtle);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .match-row:active { background: var(--bg-card-inner); }
  .match-row-teams { font-size: 13px; font-weight: 600; flex: 1; }
  .match-row-time {
    font-size: 11px; font-weight: 700; color: var(--amber);
    background: rgba(245,185,66,0.1);
    padding: 3px 9px; border-radius: 8px;
    flex-shrink: 0; margin-left: 10px;
  }

  .sub-league-label {
    font-size: 10px; font-weight: 700; color: var(--text-secondary);
    padding: 10px 16px 2px;
    border-top: 1px solid var(--border-subtle);
  }

  /* "Diger Ulkeler" ana kapak butonu */
  .other-toggle {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 14px 16px;
    cursor: pointer;
    margin-top: 6px;
  }
  .other-toggle-left { display: flex; align-items: center; gap: 10px; }
  .other-toggle-icon { font-size: 16px; }
  .other-toggle-text { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }
  .other-toggle-sub { font-size: 10px; color: var(--text-muted); margin-top: 1px; }
  .other-chevron { font-size: 12px; color: var(--text-secondary); transition: transform 0.2s ease; }
  .other-toggle.expanded .other-chevron { transform: rotate(90deg); color: var(--teal); }

  .other-countries-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    margin-top: 8px;
  }
  .other-countries-wrap.expanded { max-height: 6000px; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); font-size: 13px; }
  .empty-state.error { color: var(--red); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card); border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-around; padding: 10px 0 20px;
  }
  .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--text-muted); }
  .nav-item.active { color: var(--teal); }
  .nav-icon { font-size: 18px; }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .lang-toggle {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 10px; padding: 6px 10px; font-size: 15px; cursor: pointer; user-select: none;
  }
  .lang-toggle .lang-code { font-size: 9.5px; font-weight: 800; color: var(--text-secondary); margin-left: 2px; }
</style>
</head>
<body>

<div class="app">

  <div class="top-bar">
    <div>
      <div class="brand-name">MATCHEDGE<span class="premium">PREMIUM</span></div>
      <div class="brand-sub" data-i18n="brandSub">UPCOMING MATCHES</div>
    </div>
    <div class="top-actions">
      <div class="lang-toggle" id="langToggle">
        <span id="langFlag">🇬🇧</span><span class="lang-code" id="langCode">EN</span>
      </div>
    </div>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <div id="matchesContainer">
    <div class="empty-state" data-i18n="loading">Loading...</div>
  </div>

</div>

<div class="bottom-nav">
  <a class="nav-item" href="ana-sayfa.html"><span class="nav-icon">🏠</span><span data-i18n="navHome">Home</span></a>
  <a class="nav-item active" href="maclar.html"><span class="nav-icon">⚽</span><span data-i18n="navMatches">Matches</span></a>
  <a class="nav-item" href="mac-sonuclari.html"><span class="nav-icon">📅</span><span data-i18n="navResults">Results</span></a>
  <a class="nav-item" href="notlarim.html"><span class="nav-icon">⭐</span><span data-i18n="navFav">Favorites</span></a>
</div>

<script>
(function() {
  if (!localStorage.getItem('matchedge_token')) {
    window.location.href = 'giris.html';
  }
})();

const API_BASE = 'https://matchedge-backend-kujb.onrender.com';
const DAYS_AHEAD = 7;

// TheSportsDB idLeague - MatchEdge'in gercek form/analiz destegi olan
// ligler. Bunlar her zaman "Öne Çıkan Ligler" altinda, en üstte gösterilir.
const PRIORITY_LEAGUE_IDS = new Set([
  '4339', // Türkiye Süper Lig
  '4328', // Premier League
  '4335', // La Liga
  '4332', // Serie A
  '4331', // Bundesliga
  '4334', // Ligue 1
  '4337', // Eredivisie
  '4336', // Yunanistan Super League
  '4358', // Norveç Eliteserien
  '4347', // İsveç Allsvenskan
  '4422', // Polonya Ekstraklasa
  '4355', // Rusya Premier Lig
  '4344', // Portekiz Liga Portugal
  '4636', // Finlandiya Veikkausliiga
  '4338', // Belçika First Division A
  '4340', // Danimarka Superligaen
  '4330', // İskoçya Premiership
]);

const TRANSLATIONS = {
  en: {
    brandSub: 'UPCOMING MATCHES', loading: 'Loading...',
    navHome: 'Home', navMatches: 'Matches', navResults: 'Results', navFav: 'Favorites',
    today: 'Today', noMatchesDate: 'No matches found for this date',
    loadError: "Couldn't load matches - pull to refresh",
    topLeagues: 'TOP LEAGUES',
    otherCountries: 'Other Countries',
    otherCountriesSub: (n) => `${n} more matches from smaller leagues`,
    matchCount: (n) => n === 1 ? '1 match' : `${n} matches`,
    dowNames: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  },
  tr: {
    brandSub: 'YAKLAŞAN MAÇLAR', loading: 'Yükleniyor...',
    navHome: 'Ana Sayfa', navMatches: 'Maçlar', navResults: 'Sonuçlar', navFav: 'Favoriler',
    today: 'Bugün', noMatchesDate: 'Bu tarihte maç bulunamadı',
    loadError: 'Maçlar yüklenemedi - yenilemek için tekrar dene',
    topLeagues: 'ÖNE ÇIKAN LİGLER',
    otherCountries: 'Diğer Ülkeler',
    otherCountriesSub: (n) => `${n} maç daha, küçük liglerden`,
    matchCount: (n) => n === 1 ? '1 maç' : `${n} maç`,
    dowNames: ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'],
  },
};

let currentLang = localStorage.getItem('matchedge_lang') || 'tr';
function t(key) { return TRANSLATIONS[currentLang][key] ?? key; }

function applyStaticTranslations() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.getElementById('langFlag').textContent = currentLang === 'tr' ? '🇬🇧' : '🇹🇷';
  document.getElementById('langCode').textContent = currentLang === 'tr' ? 'EN' : 'TR';
}

document.getElementById('langToggle').addEventListener('click', () => {
  currentLang = currentLang === 'tr' ? 'en' : 'tr';
  localStorage.setItem('matchedge_lang', currentLang);
  applyStaticTranslations();
  renderDayTabs();
  loadMatches();
});

function getNextNDays(n) {
  const days = [];
  for (let i = 0; i < n; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  return days;
}

function formatDateKey(d) { return d.toISOString().split('T')[0]; }
function isToday(d) { return formatDateKey(d) === formatDateKey(new Date()); }

let selectedDate = formatDateKey(new Date());
let expandedKeys = new Set();
let otherExpanded = false;

function renderDayTabs() {
  const tabsEl = document.getElementById('dayTabs');
  const days = getNextNDays(DAYS_AHEAD);
  const dowNames = t('dowNames');

  tabsEl.innerHTML = days.map(d => {
    const key = formatDateKey(d);
    const active = key === selectedDate;
    const label = isToday(d) ? t('today') : dowNames[d.getDay()];
    return `
      <div class="day-tab ${active ? 'active' : ''}" data-date="${key}">
        <div class="dow">${label}</div>
        <div class="dnum">${d.getDate()}</div>
      </div>
    `;
  }).join('');

  tabsEl.querySelectorAll('.day-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedDate = tab.dataset.date;
      expandedKeys = new Set();
      otherExpanded = false;
      renderDayTabs();
      loadMatches();
    });
  });
}

// TheSportsDB lig isimleri genelde "Ulke/Milliyet Lig Adi" seklinde
// geliyor (orn. "Indonesian Super League") - ayri bir ulke alani
// vermiyor. Ilk kelimeyi kaba bir "ulke" etiketi olarak kullaniyoruz.
function guessCountry(leagueName) {
  const firstWord = (leagueName || '').trim().split(' ')[0];
  return firstWord || (currentLang === 'tr' ? 'Diğer' : 'Other');
}

async function loadMatches() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = `<div class="empty-state">${t('loading')}</div>`;

  let matches = [];
  try {
    const res = await fetch(`${API_BASE}/api/matches?date=${selectedDate}`);
    if (!res.ok) throw new Error('http_' + res.status);
    const json = await res.json();
    matches = (json.matches || [])
      .filter(m => m.statusShort === 'NS')
      .sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
  } catch (err) {
    console.warn('Maçlar alınamadı:', err.message);
    container.innerHTML = `<div class="empty-state error">${t('loadError')}</div>`;
    return;
  }

  renderAll(matches);
}

function groupByLeague(matches) {
  const groups = new Map();
  matches.forEach(m => {
    const league = m.league || '—';
    if (!groups.has(league)) groups.set(league, []);
    groups.get(league).push(m);
  });
  return groups;
}

function leagueGroupHtml(league, leagueMatches, isPriority, keyPrefix) {
  const key = keyPrefix + league;
  const isExpanded = expandedKeys.has(key);
  const firstTime = leagueMatches[0].kickoff
    ? new Date(leagueMatches[0].kickoff).toLocaleTimeString(currentLang === 'tr' ? 'tr-TR' : 'en-GB', { hour: '2-digit', minute: '2-digit' })
    : '--:--';

  return `
    <div class="league-group ${isPriority ? 'priority' : ''} ${isExpanded ? 'expanded' : ''}" data-key="${key.replace(/"/g, '&quot;')}">
      <div class="league-header">
        <div class="league-header-left">
          <div class="league-name">${league}</div>
          <div class="league-meta">${t('matchCount')(leagueMatches.length)} • ${firstTime}+</div>
        </div>
        <div class="league-chevron">▶</div>
      </div>
      <div class="league-matches">
        ${leagueMatches.map(m => {
          const timeLabel = m.kickoff
            ? new Date(m.kickoff).toLocaleTimeString(currentLang === 'tr' ? 'tr-TR' : 'en-GB', { hour: '2-digit', minute: '2-digit' })
            : '--:--';
          return `
            <div class="match-row" data-fixture-id="${m.fixtureId}">
              <div class="match-row-teams">${m.homeTeam} - ${m.awayTeam}</div>
              <div class="match-row-time">${timeLabel}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderAll(matches) {
  const container = document.getElementById('matchesContainer');

  if (matches.length === 0) {
    container.innerHTML = `<div class="empty-state">${t('noMatchesDate')}</div>`;
    return;
  }

  const priorityMatches = matches.filter(m => PRIORITY_LEAGUE_IDS.has(String(m.leagueId)));
  const otherMatches = matches.filter(m => !PRIORITY_LEAGUE_IDS.has(String(m.leagueId)));

  let html = '';

  // --- Öne cikan ligler ---
  if (priorityMatches.length > 0) {
    const priorityGroups = groupByLeague(priorityMatches);
    const sortedPriorityLeagues = [...priorityGroups.keys()].sort((a, b) => {
      return new Date(priorityGroups.get(a)[0].kickoff || 0) - new Date(priorityGroups.get(b)[0].kickoff || 0);
    });
    html += `<div class="section-title">${t('topLeagues')} <span class="badge">${priorityMatches.length}</span></div>`;
    html += sortedPriorityLeagues.map(l => leagueGroupHtml(l, priorityGroups.get(l), true, 'p:')).join('');
  }

  // --- Diger ulkeler (kapali, ulke ulke) ---
  if (otherMatches.length > 0) {
    const countryGroups = new Map();
    otherMatches.forEach(m => {
      const country = guessCountry(m.league);
      if (!countryGroups.has(country)) countryGroups.set(country, []);
      countryGroups.get(country).push(m);
    });
    const sortedCountries = [...countryGroups.keys()].sort();

    html += `
      <div class="other-toggle ${otherExpanded ? 'expanded' : ''}" id="otherToggle">
        <div class="other-toggle-left">
          <div class="other-toggle-icon">🌍</div>
          <div>
            <div class="other-toggle-text">${t('otherCountries')}</div>
            <div class="other-toggle-sub">${t('otherCountriesSub')(otherMatches.length)}</div>
          </div>
        </div>
        <div class="other-chevron">▶</div>
      </div>
      <div class="other-countries-wrap ${otherExpanded ? 'expanded' : ''}" id="otherWrap">
        ${sortedCountries.map(country => {
          const countryMatches = countryGroups.get(country);
          const countryKey = 'c:' + country;
          const countryExpanded = expandedKeys.has(countryKey);
          const leaguesInCountry = groupByLeague(countryMatches);
          const multiLeague = leaguesInCountry.size > 1;

          return `
            <div class="league-group ${countryExpanded ? 'expanded' : ''}" data-key="${countryKey.replace(/"/g, '&quot;')}">
              <div class="league-header">
                <div class="league-header-left">
                  <div class="league-name">${country}</div>
                  <div class="league-meta">${t('matchCount')(countryMatches.length)}</div>
                </div>
                <div class="league-chevron">▶</div>
              </div>
              <div class="league-matches">
                ${[...leaguesInCountry.entries()].map(([leagueName, lm]) => `
                  ${multiLeague ? `<div class="sub-league-label">${leagueName}</div>` : ''}
                  ${lm.map(m => {
                    const timeLabel = m.kickoff
                      ? new Date(m.kickoff).toLocaleTimeString(currentLang === 'tr' ? 'tr-TR' : 'en-GB', { hour: '2-digit', minute: '2-digit' })
                      : '--:--';
                    return `
                      <div class="match-row" data-fixture-id="${m.fixtureId}" style="${multiLeague ? '' : 'border-top:1px solid var(--border-subtle);'}">
                        <div class="match-row-teams">${m.homeTeam} - ${m.awayTeam}</div>
                        <div class="match-row-time">${timeLabel}</div>
                      </div>
                    `;
                  }).join('')}
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  container.innerHTML = html;
  attachHandlers(container);
}

function attachHandlers(container) {
  const otherToggle = document.getElementById('otherToggle');
  if (otherToggle) {
    otherToggle.addEventListener('click', () => {
      otherExpanded = !otherExpanded;
      otherToggle.classList.toggle('expanded');
      document.getElementById('otherWrap').classList.toggle('expanded');
    });
  }

  container.querySelectorAll('.league-header').forEach(header => {
    header.addEventListener('click', () => {
      const group = header.closest('.league-group');
      const key = group.dataset.key;
      if (expandedKeys.has(key)) expandedKeys.delete(key);
      else expandedKeys.add(key);
      group.classList.toggle('expanded');
    });
  });

  container.querySelectorAll('.match-row').forEach(row => {
    row.addEventListener('click', () => {
      window.location.href = `analiz-ekrani.html?fixtureId=${encodeURIComponent(row.dataset.fixtureId)}`;
    });
  });
}

applyStaticTranslations();
renderDayTabs();
loadMatches();
</script>

</body>
</html>
