<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MatchEdge - Maçlar</title>
<style>
  :root {
    --bg-base: #0a0e17;
    --bg-card: #121826;
    --bg-card-inner: #0d1220;
    --border-subtle: #1e2636;
    --teal: #2dd4bf;
    --purple: #9d7cf0;
    --amber: #f5b942;
    --red: #f0556b;
    --text-primary: #f2f4f8;
    --text-secondary: #8b93a7;
    --text-muted: #5a6478;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
    overflow-x: hidden;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 4px 18px;
  }
  .brand-name { font-size: 19px; font-weight: 800; }
  .brand-name .premium { color: var(--teal); margin-left: 4px; }
  .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; margin-top: 2px; }

  .day-tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 12px; scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 10px 14px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 12px; min-width: 56px; cursor: pointer;
  }
  .day-tab.active { background: rgba(45,212,191,0.12); border-color: var(--teal); }
  .day-tab .dow { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
  .day-tab.active .dow { color: var(--teal); }
  .day-tab .dnum { font-size: 15px; font-weight: 800; }

  .league-filters {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
    margin-bottom: 16px; scrollbar-width: none;
  }
  .league-filters::-webkit-scrollbar { display: none; }
  .league-chip {
    flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 7px 13px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 20px; color: var(--text-secondary); cursor: pointer; white-space: nowrap;
  }
  .league-chip.active { background: rgba(45,212,191,0.12); border-color: var(--teal); color: var(--teal); }

  .match-card {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .match-card:active { transform: scale(0.98); border-color: rgba(45,212,191,0.5); }
  .match-league {
    font-size: 10px; color: var(--text-muted); margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .match-time-pill {
    font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
    background: rgba(245,185,66,0.12); color: var(--amber);
  }
  .match-teams { font-size: 13.5px; font-weight: 700; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
  .empty-state.error { color: var(--red); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card); border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-around; padding: 10px 0 20px;
  }
  .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--text-muted); }
  .nav-item.active { color: var(--teal); }
  .nav-icon { font-size: 18px; }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .lang-toggle {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 10px; padding: 6px 10px; font-size: 15px; cursor: pointer; user-select: none;
  }
  .lang-toggle .lang-code { font-size: 9.5px; font-weight: 800; color: var(--text-secondary); margin-left: 2px; }
</style>
</head>
<body>

<div class="app">

  <div class="top-bar">
    <div>
      <div class="brand-name">MATCHEDGE<span class="premium">PREMIUM</span></div>
      <div class="brand-sub" data-i18n="brandSub">UPCOMING MATCHES</div>
    </div>
    <div class="top-actions">
      <div class="lang-toggle" id="langToggle">
        <span id="langFlag">🇬🇧</span><span class="lang-code" id="langCode">EN</span>
      </div>
    </div>
  </div>

  <div class="day-tabs" id="dayTabs"></div>
  <div class="league-filters" id="leagueFilters"></div>

  <div id="matchesContainer">
    <div class="empty-state" data-i18n="loading">Loading...</div>
  </div>

</div>

<div class="bottom-nav">
  <a class="nav-item" href="ana-sayfa.html"><span class="nav-icon">🏠</span><span data-i18n="navHome">Home</span></a>
  <a class="nav-item active" href="maclar.html"><span class="nav-icon">⚽</span><span data-i18n="navMatches">Matches</span></a>
  <a class="nav-item" href="mac-sonuclari.html"><span class="nav-icon">📅</span><span data-i18n="navResults">Results</span></a>
  <a class="nav-item" href="notlarim.html"><span class="nav-icon">⭐</span><span data-i18n="navFav">Favorites</span></a>
</div>

<script>
(function() {
  if (!localStorage.getItem('matchedge_token')) {
    window.location.href = 'giris.html';
  }
})();

const API_BASE = 'https://matchedge-backend-kujb.onrender.com';
const DAYS_AHEAD = 7;

const TRANSLATIONS = {
  en: {
    brandSub: 'UPCOMING MATCHES', loading: 'Loading...',
    navHome: 'Home', navMatches: 'Matches', navResults: 'Results', navFav: 'Favorites',
    today: 'Today', noMatchesDate: 'No matches found for this date',
    loadError: "Couldn't load matches - pull to refresh",
    allLeagues: 'All',
    dowNames: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  },
  tr: {
    brandSub: 'YAKLAŞAN MAÇLAR', loading: 'Yükleniyor...',
    navHome: 'Ana Sayfa', navMatches: 'Maçlar', navResults: 'Sonuçlar', navFav: 'Favoriler',
    today: 'Bugün', noMatchesDate: 'Bu tarihte maç bulunamadı',
    loadError: 'Maçlar yüklenemedi - yenilemek için tekrar dene',
    allLeagues: 'Tümü',
    dowNames: ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'],
  },
};

let currentLang = localStorage.getItem('matchedge_lang') || 'tr';
function t(key) { return TRANSLATIONS[currentLang][key] ?? key; }

function applyStaticTranslations() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.getElementById('langFlag').textContent = currentLang === 'tr' ? '🇬🇧' : '🇹🇷';
  document.getElementById('langCode').textContent = currentLang === 'tr' ? 'EN' : 'TR';
}

document.getElementById('langToggle').addEventListener('click', () => {
  currentLang = currentLang === 'tr' ? 'en' : 'tr';
  localStorage.setItem('matchedge_lang', currentLang);
  applyStaticTranslations();
  renderDayTabs();
  loadMatches();
});

function getNextNDays(n) {
  const days = [];
  for (let i = 0; i < n; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    days.push(d);
  }
  return days;
}

function formatDateKey(d) {
  return d.toISOString().split('T')[0];
}

function isToday(d) {
  return formatDateKey(d) === formatDateKey(new Date());
}

let selectedDate = formatDateKey(new Date());
let selectedLeague = null;
let allMatchesForDay = [];

function renderDayTabs() {
  const tabsEl = document.getElementById('dayTabs');
  const days = getNextNDays(DAYS_AHEAD);
  const dowNames = t('dowNames');

  tabsEl.innerHTML = days.map(d => {
    const key = formatDateKey(d);
    const active = key === selectedDate;
    const label = isToday(d) ? t('today') : dowNames[d.getDay()];
    return `
      <div class="day-tab ${active ? 'active' : ''}" data-date="${key}">
        <div class="dow">${label}</div>
        <div class="dnum">${d.getDate()}</div>
      </div>
    `;
  }).join('');

  tabsEl.querySelectorAll('.day-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedDate = tab.dataset.date;
      selectedLeague = null;
      renderDayTabs();
      loadMatches();
    });
  });
}

function renderLeagueFilters() {
  const filtersEl = document.getElementById('leagueFilters');
  const leagues = [...new Set(allMatchesForDay.map(m => m.league).filter(Boolean))].sort();

  if (leagues.length <= 1) {
    filtersEl.innerHTML = '';
    return;
  }

  const chips = [`<div class="league-chip ${!selectedLeague ? 'active' : ''}" data-league="">${t('allLeagues')}</div>`]
    .concat(leagues.map(l => `<div class="league-chip ${selectedLeague === l ? 'active' : ''}" data-league="${l.replace(/"/g, '&quot;')}">${l}</div>`));

  filtersEl.innerHTML = chips.join('');

  filtersEl.querySelectorAll('.league-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      selectedLeague = chip.dataset.league || null;
      renderLeagueFilters();
      renderMatches(filterByLeague(allMatchesForDay));
    });
  });
}

function filterByLeague(matches) {
  if (!selectedLeague) return matches;
  return matches.filter(m => m.league === selectedLeague);
}

async function loadMatches() {
  const container = document.getElementById('matchesContainer');
  container.innerHTML = `<div class="empty-state">${t('loading')}</div>`;

  try {
    const res = await fetch(`${API_BASE}/api/matches?date=${selectedDate}`);
    if (!res.ok) throw new Error('http_' + res.status);
    const json = await res.json();
    allMatchesForDay = (json.matches || [])
      .filter(m => m.statusShort === 'NS')
      .sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
  } catch (err) {
    console.warn('Maçlar alınamadı:', err.message);
    allMatchesForDay = [];
    document.getElementById('leagueFilters').innerHTML = '';
    container.innerHTML = `<div class="empty-state error">${t('loadError')}</div>`;
    return;
  }

  renderLeagueFilters();
  renderMatches(filterByLeague(allMatchesForDay));
}

function renderMatches(matches) {
  const container = document.getElementById('matchesContainer');

  if (matches.length === 0) {
    container.innerHTML = `<div class="empty-state">${t('noMatchesDate')}</div>`;
    return;
  }

  container.innerHTML = matches.map(m => {
    const timeLabel = m.kickoff
      ? new Date(m.kickoff).toLocaleTimeString(currentLang === 'tr' ? 'tr-TR' : 'en-GB', { hour: '2-digit', minute: '2-digit' })
      : '--:--';

    return `
      <div class="match-card" data-fixture-id="${m.fixtureId}">
        <div class="match-league">
          <span>${m.league || ''}</span>
          <span class="match-time-pill">${timeLabel}</span>
        </div>
        <div class="match-teams">${m.homeTeam} - ${m.awayTeam}</div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.match-card').forEach(card => {
    card.addEventListener('click', () => {
      window.location.href = `analiz-ekrani.html?fixtureId=${encodeURIComponent(card.dataset.fixtureId)}`;
    });
  });
}

applyStaticTranslations();
renderDayTabs();
loadMatches();
</script>

</body>
</html>
