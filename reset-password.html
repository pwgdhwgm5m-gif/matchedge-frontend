<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SoccerEdge Pro - Reset Password</title>
<style>
  :root {
    --bg-base: #0a0e17; --bg-card: #121826; --bg-card-inner: #0d1220; --border-subtle: #1e2636;
    --teal: #2dd4bf; --red: #f0556b; --green: #4ade80;
    --text-primary: #f2f4f8; --text-secondary: #8b93a7; --text-muted: #5a6478;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .wrap { max-width: 340px; width: 100%; }
  .brand { text-align: center; margin-bottom: 24px; font-size: 20px; font-weight: 800; }
  .brand .premium { color: var(--teal); margin-left: 4px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 16px; padding: 22px 20px;
  }
  h2 { font-size: 15px; margin-bottom: 16px; }
  .field-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
  .field-input {
    width: 100%; background: var(--bg-card-inner); border: 1px solid var(--border-subtle);
    border-radius: 10px; padding: 12px 13px; color: var(--text-primary);
    font-size: 14px; margin-bottom: 16px;
  }
  .field-input:focus { outline: none; border-color: var(--teal); }
  .submit-btn {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    background: var(--teal); color: #05201c; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.6; }
  .msg {
    font-size: 12px; padding: 10px 12px; border-radius: 10px; margin-bottom: 16px; display: none;
  }
  .msg.error { background: rgba(240,85,107,0.1); border: 1px solid rgba(240,85,107,0.35); color: var(--red); }
  .msg.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.35); color: var(--green); }
  .msg.show { display: block; }
  a.link { display:block; text-align:center; color: var(--teal); font-size: 12px; margin-top: 14px; text-decoration:none; }
</style>
<link rel="stylesheet" href="dark-ui-v2.css?v=20260922-1">
</head>
<body>

<div class="wrap">
  <div class="brand">SOCCEREDGE<span class="premium">PRO</span></div>
  <div class="card">
    <h2 id="title">Yeni Şifre Belirle</h2>
    <div class="msg" id="msgBox"></div>

    <div id="formArea">
      <div class="field-label" id="labelNew">Yeni Şifre</div>
      <input type="password" class="field-input" id="newPassword">
      <div class="field-label" id="labelConfirm">Yeni Şifre (Tekrar)</div>
      <input type="password" class="field-input" id="confirmPassword">
      <button class="submit-btn" id="submitBtn">Şifreyi Değiştir</button>
    </div>

    <a class="link" href="giris.html" id="loginLink">Girişe dön</a>
  </div>
</div>

<script>
const API_BASE = 'https://matchedge-backend-kujb.onrender.com'; // örn: 'https://matchedge-backend.onrender.com'
const lang = localStorage.getItem('matchedge_lang') || 'en';

const T = {
  tr: {
    title: 'Yeni Şifre Belirle', labelNew: 'Yeni Şifre', labelConfirm: 'Yeni Şifre (Tekrar)',
    submitBtn: 'Şifreyi Değiştir', connecting: 'Değiştiriliyor...',
    loginLink: 'Girişe dön',
    noToken: 'Geçersiz bağlantı - bu sayfa bir sıfırlama bağlantısı olmadan açılamaz.',
    mismatch: 'Şifreler eşleşmiyor.', tooShort: 'Şifre en az 6 karakter olmalı.',
    backendMissing: 'Backend bağlı değil - önce bu dosyadaki API_BASE değerini ayarla.',
    success: 'Şifren değiştirildi! Şimdi yeni şifrenle giriş yapabilirsin.',
    networkError: 'Sunucuya ulaşılamadı.',
  },
  en: {
    title: 'Set a New Password', labelNew: 'New Password', labelConfirm: 'Confirm New Password',
    submitBtn: 'Change Password', connecting: 'Changing...',
    loginLink: 'Back to log in',
    noToken: 'Invalid link - this page cannot be opened without a reset link.',
    mismatch: 'Passwords do not match.', tooShort: 'Password must be at least 6 characters.',
    backendMissing: 'Backend not connected - set API_BASE in this file first.',
    success: 'Your password has been changed! You can log in with it now.',
    networkError: 'Could not reach the server.',
  },
};

document.getElementById('title').textContent = T[lang].title;
document.getElementById('labelNew').textContent = T[lang].labelNew;
document.getElementById('labelConfirm').textContent = T[lang].labelConfirm;
document.getElementById('submitBtn').textContent = T[lang].submitBtn;
document.getElementById('loginLink').textContent = T[lang].loginLink;

function showMsg(text, type) {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = `msg show ${type}`;
}

const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  showMsg(T[lang].noToken, 'error');
  document.getElementById('formArea').style.display = 'none';
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword.length < 6) { showMsg(T[lang].tooShort, 'error'); return; }
  if (newPassword !== confirmPassword) { showMsg(T[lang].mismatch, 'error'); return; }
  if (!API_BASE) { showMsg(T[lang].backendMissing, 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = T[lang].connecting;

  try {
    const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg(data.error || T[lang].networkError, 'error');
      return;
    }

    showMsg(T[lang].success, 'success');
    document.getElementById('formArea').style.display = 'none';
  } catch (err) {
    showMsg(T[lang].networkError, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = T[lang].submitBtn;
  }
});
</script>

<script src="language-selector.js"></script>\n</body>
</html>
