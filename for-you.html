<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · For You</title><style>:root{--card:#0b2b59;--line:#244b79;--gold:#f2c94c;--muted:#a9bbd6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#092957,#061b3a);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:14px}.head{display:flex;align-items:center;gap:10px}.back{border:1px solid var(--line);background:var(--card);color:var(--gold);border-radius:10px;padding:9px 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px}.who{font-size:11px;font-weight:900}.tier{padding:2px 6px;border:1px solid currentColor;border-radius:99px;font-size:8px}.match{font-weight:900;margin-top:8px}.pick{margin-top:7px;color:var(--gold);font-weight:950}.sub{color:var(--muted);font-size:9px}.won{color:#35c878}.lost{color:#ef5350}.pending{color:#f2c94c}.void{color:#a9bbd6}.actions{display:flex;gap:7px;margin-top:9px}.actions a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:7px;color:#fff;font-size:9px;font-weight:900}</style></head><body><main class="app"><header class="head"><button class="back" onclick="location.href='edge-arena.html'">←</button><div><b>FOR YOU</b><div class="sub">Picks from analysts you follow</div></div></header><div id="feed"><div class="card sub">Loading…</div></div></main><script>const API='https://matchedge-backend-kujb.onrender.com',t=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+t};if(!t)location.href='giris.html';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function resultMeta(r){return r==='won'?['✓ WON','won']:r==='lost'?['✕ LOST','lost']:r==='void'?['— VOID','void']:['⧗ PENDING','pending']}
function room(x){return 'match-room.html?fixtureId='+encodeURIComponent(x.fixtureId)+'&home='+encodeURIComponent(x.homeTeam||'')+'&away='+encodeURIComponent(x.awayTeam||'')+'&league='+encodeURIComponent(x.league||'')+'&kickoff='+encodeURIComponent(x.kickoff||'')}
async function load(){const r=await fetch(API+'/api/community/feed/following',{headers:H}),d=await r.json();feed.innerHTML=(d.items||[]).map(x=>{const m=resultMeta(x.result);return '<article class="card"><div class="who" onclick="location.href=\'social-profile.html?u='+encodeURIComponent(x.user?.username||'')+'\'">@'+e(x.user?.username)+' <span class="tier" style="color:'+e(x.user?.analystTier?.color||'#9aa4b8')+'">'+e(x.user?.analystTier?.name||'Rookie')+' · '+Number(x.user?.accuracy||0)+'%</span></div><div class="match">'+e(x.homeTeam)+' – '+e(x.awayTeam)+'</div><div class="sub">'+e(x.league)+' · '+e(x.market)+'</div><div class="pick '+m[1]+'">✓ MY PICK · '+e(x.label)+' · '+m[0]+'</div><div class="actions"><a href="social-profile.html?u='+encodeURIComponent(x.user?.username||'')+'">PROFILE</a><a href="'+room(x)+'">MATCH ROOM</a></div></article>'}).join('')||'<div class="card sub">Follow analysts to build your feed.</div>'}load()</script></body></html>
