</head><body><main class="app"><header class="top"><button class="back" onclick="location.href='edge-arena.html'">‹</button><div><b>FIND ANALYSTS</b><div class="sub">Search SoccerEdge users</div></div></header><section class="card"><div class="search"><input id="q" type="search" name="analyst_search_query" placeholder="Username" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search"><button class="btn" onclick="go()">Search</button></div><div id="out" style="margin-top:10px" class="sub">Type at least 2 characters.</div></section></main><script>const API='https://matchedge-backend-kujb.onrender.com',t=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+t};const LANG=(localStorage.getItem('matchedge_lang')||'en')==='tr'?'tr':'en';if(!t)location.href='giris.html';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function go(){const q=document.getElementById('q').value.trim();if(q.length<2)return;const r=await fetch(API+'/api/community/users/search?q='+encodeURIComponent(q),{headers:H}),d=await r.json();document.getElementById('out').innerHTML=(d.users||[]).map(u=>'<div class="person"><span class="person-main" onclick="location.href=\'social-profile.html?u='+encodeURIComponent(u.username)+'\'"><b>@'+e(u.username)+'</b><br><small>'+e(u.analystTier?.name||'Rookie')+' · '+u.accuracy+'%</small></span><button class="follow-btn '+(u.isFollowing?'following':'')+'" onclick="event.stopPropagation();toggleFollow(this,\''+u.id+'\','+(u.isFollowing?'true':'false')+')">'+(u.isFollowing?(LANG==='tr'?'Takip Ediliyor ✓':'Following ✓'):(LANG==='tr'?'Takip Et':'Follow'))+'</button></div>').join('')||(LANG==='tr'?'Kullanıcı bulunamadı.':'No users found.')}async function toggleFollow(btn,id,isFollowing){btn.disabled=true;try{const r=await fetch(API+'/api/community/follow/'+encodeURIComponent(id),{method:isFollowing?'DELETE':'POST',headers:H});if(!r.ok)throw Error('follow');btn.classList.toggle('following',!isFollowing);btn.textContent=!isFollowing?(LANG==='tr'?'Takip Ediliyor ✓':'Following ✓'):(LANG==='tr'?'Takip Et':'Follow');btn.setAttribute('onclick',`event.stopPropagation();toggleFollow(this,'${id}',${!isFollowing})`)}finally{btn.disabled=false}}document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')go()}</script></body><script src="global-slip.js"></script></html>
