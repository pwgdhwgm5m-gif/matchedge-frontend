</head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button><h2 id="title">MESSAGES</h2></div><div id="view">Loading…</div></main><script>const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),headers={Authorization:'Bearer '+token,'Content-Type':'application/json'},q=new URLSearchParams(location.search),uid=q.get('user');if(!token)location.href='giris.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function inbox(){const r=await fetch(API+'/api/messages/inbox',{headers}),d=await r.json();view.innerHTML=(d.conversations||[]).map(x=>'<div class="card conv" onclick="location.href=\'mesajlar.html?user='+x.userId+'\'"><span class="badge">'+(x.unread||'')+'</span><div class="name">'+esc(x.username)+'</div><div class="muted">'+esc(x.lastText)+'</div></div>').join('')||'<div class="card">No messages yet.</div>'}async function thread(){const r=await fetch(API+'/api/messages/dm/'+uid,{headers}),d=await r.json();if(!r.ok){view.textContent=d.error||'Error';return}title.textContent=d.user?.username||'MESSAGES';view.innerHTML='<div class="msgs">'+d.messages.map(x=>'<div class="msg '+(x.mine?'mine':'')+'">'+esc(x.text)+'</div>').join('')+'</div><form class="composer" id="form"><input id="text" maxlength="280" placeholder="Reply…" autocomplete="off"><button>Send</button></form>';form.onsubmit=async e=>{e.preventDefault();const t=text.value.trim();if(!t)return;const rr=await fetch(API+'/api/messages/dm/'+uid,{method:'POST',headers,body:JSON.stringify({text:t})}),dd=await rr.json();if(!rr.ok)return alert(dd.error||'Message not sent');text.value='';thread()};scrollTo(0,document.body.scrollHeight)}uid?thread():inbox();setInterval(()=>uid?thread():inbox(),8000);</script><script src="language-selector.js"></script></body></html>
