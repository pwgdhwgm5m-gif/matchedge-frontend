<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Messages</title><style>:root{--bg:#101516;--panel:#181e1f;--panel2:#202728;--line:#354142;--teal:#39c7c1;--coral:#ef6a63;--text:#f6f8f7;--muted:#9caaa7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;height:100dvh;margin:auto;padding:0 14px 12px;display:flex;flex-direction:column}.top{height:68px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);flex:0 0 auto}.back{width:38px;height:38px;background:var(--panel2);border:1px solid var(--line);color:#c6a8ef;border-radius:50%;font-size:18px}.top h2{font-size:16px;margin:0;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px;margin:9px 0}.conv{cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#315f5b,#243637);font-weight:900;font-size:17px;position:relative}.avatar .dot{position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:#65706e;border:2px solid var(--panel)}.avatar .dot.online{background:#35c878}.name{font-weight:900;font-size:14px}.muted{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:var(--coral);min-width:20px;height:20px;border-radius:999px;padding:2px 6px;display:grid;place-items:center;font-size:10px;font-weight:900}.msgs{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 2px 8px;scroll-behavior:smooth}.msgwrap{display:flex;flex-direction:column;max-width:82%;align-self:flex-st  href="dark-ui-v2.css?v=20260922-1">
</head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button><h2 id="title">MESSAGES</h2><span id="presence" class="presence-dot"></span><div id="chatActions" class="chat-actions"></div></div><div id="view">Loading…</div></main><script>const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),headers={Authorization:'Bearer '+token,'Content-Type':'application/json'},q=new URLSearchParams(location.search),uid=q.get('user'),L=(localStorage.getItem('matchedge_lang')||'en')==='tr'?'tr':'en';if(!token)location.href='giris.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ago=d=>{if(!d)return'';const n=Math.max(0,Date.now()-new Date(d)),m=Math.floor(n/60000);return m<1?(L==='tr'?'şimdi':'now'):m<60?m+(L==='tr'?' dk':'m'):Math.floor(m/60)+(L==='tr'?' sa':'h')};let first=true,typingTimer;
async function heartbeat(){fetch(API+'/api/messages/presence',{method:'POST',headers}).catch(()=>{})}
async function inbox(){const r=await fetch(API+'/api/messages/inbox',{headers}),d=await r.json();title.textContent=L==='tr'?'MESAJLAR':'MESSAGES';presence.style.display='none';chatActions.innerHTML='';view.innerHTML=(d.conversations||[]).map(x=>'<div class="card conv" onclick="location.href=\'mesajlar.html?user='+x.userId+'\'"><div class="avatar">'+esc((x.username||'?')[0].toUpperCase())+'<i class="dot '+(x.online?'online':'')+'"></i></div><div><div class="name">@'+esc(x.username)+'</div><div class="muted">'+(x.mine?(L==='tr'?'Sen: ':'You: '):'')+esc(x.lastText)+' · '+ago(x.lastAt)+'</div></div>'+(x.unread?'<span class="badge">'+x.unread+'</span>':'')+'</div>').join('')||'<div class="card">'+(L==='tr'?'Henüz mesaj yok.':'No messages yet.')+'</div>'}
async function thread(){const boxBefore=document.querySelector('.msgs'),nearBottom=!boxBefore||boxBefore.scrollHeight-boxBefore.scrollTop-boxBefore.clientHeight<80;const r=await fetch(API+'/api/messages/dm/'+uid,{headers}),d=await r.json();if(!r.ok){view.textContent=d.error||'Error';return}title.textContent='@'+(d.user?.username||'');presence.style.display='inline-block';presence.classList.toggle('online',!!d.user?.online);presence.title=d.user?.online?'Online':(L==='tr'?'Çevrimdışı':'Offline');chatActions.innerHTML='<button class="delete-chat" aria-label="Delete chat" onclick="deleteChat()">•••</button>';const rows=d.messages||[];view.innerHTML='<div class="status">'+(d.user?.online?'Online':(L==='tr'?'Çevrimdışı':'Offline'))+'</div><div class="msgs">'+rows.map((x,i)=>'<div class="msgwrap '+(x.mine?'mine':'')+'"><div class="msg">'+esc(x.text)+'</div><div class="meta">'+ago(x.createdAt)+(x.mine?' · '+(x.read?'✓✓ '+(L==='tr'?'Okundu':'Read'):'✓ '+(L==='tr'?'Gönderildi':'Sent')):'')+'</div></div>').join('')+'</div><div class="typing" id="typing"></div><form class="composer" id="form"><input id="text" maxlength="280" placeholder="'+(L==='tr'?'Mesaj yaz…':'Message…')+'" autocomplete="off"><button aria-label="Send">➤</button></form>';form.onsubmit=async e=>{e.preventDefault();const t=text.value.trim();if(!t)return;const rr=await fetch(API+'/api/messages/dm/'+uid,{method:'POST',headers,body:JSON.stringify({text:t})}),dd=await rr.json();if(!rr.ok)return alert(dd.error||'Message not sent');text.value='';await thread()};text.oninput=()=>{clearTimeout(typingTimer);typingTimer=setTimeout(()=>{},900)};const box=document.querySelector('.msgs');if(box&&(first||nearBottom))box.scrollTop=box.scrollHeight;first=false}
async function deleteChat(){if(!confirm(L==='tr'?'Bu sohbet silinsin mi?':'Delete this chat?'))return;await fetch(API+'/api/messages/dm/'+uid,{method:'DELETE',headers});location.href='friends.html'}heartbeat();setInterval(heartbeat,45000);uid?thread():inbox();setInterval(()=>uid?thread():inbox(),5000);</script><script src="language-selector.js"></script></body></html>
