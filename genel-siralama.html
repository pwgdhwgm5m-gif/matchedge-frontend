<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Genel Sıralama</title><style>:root{--bg:#061b3a;--card:#0b2b59;--line:#244b79;--gold:#f2c94c;--muted:#91a7c7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061b3a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.app{width:100%;max-width:480px;min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px)}.head{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;padding:10px 0 18px;border-bottom:1px solid var(--line)}.back{width:44px;height:44px;border:1px solid #315b8c;background:#0a2a55;color:var(--gold);border-radius:14px;font-size:24px;line-height:1}.title{font-size:21px;font-weight:950;letter-spacing:.3px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.list{padding:16px 0}.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;background:linear-gradient(145deg,#0c2e5d,#09264d);border:1px solid #244b79;border-radius:14px;padding:13px 12px;margin-bottom:9px;box-shadow:0 7px 20px #00132944}.row.me{border-color:var(--gold);box-shadow:0 0 0 1px #f2c94c33}.place{font-size:17px;font-weight:950;text-align:center}.name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:10px;color:var(--muted);margin-top:4px}.right{text-align:right}.right strong{display:block;color:var(--gold);font-size:13px}.right span{font-size:10px;color:var(--muted)}.empty-wrap{min-height:55dvh;display:flex;align-items:center;justify-content:center}.empty-card{width:100%;background:linear-gradient(145deg,#0c2e5d,#09264d);border:1px solid #244b79;border-radius:18px;padding:34px 22px;text-align:center;box-shadow:0 10px 28px #00132955}.empty-icon{font-size:34px;margin-bottom:12px}.empty-title{font-size:16px;font-weight:900}.empty-sub{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5}.empty{color:var(--muted);text-align:center;padding:40px 15px}</style><link rel="stylesheet" href="premium-theme.css?v=20260921a"><style id="ranking-charcoal-fix">html,body,.app{background:#121718!important}.head{border-color:#414b4c!important}.back{background:#202526!important;border-color:#465253!important;color:#c6a8ef!important}.sub,.badge,.right span,.empty-sub,.empty{color:#aebdb9!important}.row,.empty-card{background:#202526!important;background-image:none!important;border-color:#465253!important;box-shadow:none!important}.row.me{border-color:#35c7bf!important}.right strong{color:#35c7bf!important}</style></head><body><main class="app"><header class="head"><button class="back" onclick="location.href='edge-arena.html'">←</button><div><div class="title" id="title">GENEL SIRALAMA</div><div class="sub" id="sub">250 XP ve üzeri oyuncular</div></div></header><section class="list" id="list"><div class="empty">Yükleniyor…</div></section></main><script>const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+token},en=(localStorage.getItem('matchedge_lang')||'en')==='en';if(!token)location.href='giris.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(en){title.textContent='GENERAL RANKING';sub.textContent='Players with 250 XP or more'}async function load(){try{const r=await fetch(API+'/api/community/leaderboard',{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Unavailable');const me=d.me||{};list.innerHTML=(d.leaderboard||[]).map(p=>'<article class="row '+(p.username===me.username?'me':'')+'"><div class="place">'+(p.position<4?['','🥇','🥈','🥉'][p.position]:'#'+p.position)+'</div><div><div class="name">'+esc(p.username)+'</div><div class="badge">'+esc(p.rank?.icon||'')+' '+esc(p.rank?.name||'')+' · %'+(p.accuracy||0)+' '+(en?'accuracy':'isabet')+'</div></div><div class="right"><strong>'+p.xp+' XP</strong><span>🪙 '+p.edgeCoins+'</span></div></article>').join('')||'<div class="empty-wrap"><div class="empty-card"><div class="empty-icon">🏆</div><div class="empty-title">'+(en?'Ranking starts at 250 XP':'Sıralama 250 XP’den başlar')+'</div><div class="empty-sub">'+(en?'No player has reached the ranking threshold yet. Keep playing to become the first.':'Henüz sıralama barajına ulaşan oyuncu yok. İlk sıraya yerleşmek için oynamaya devam et.')+'</div></div></div>'}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}load();setInterval(load,30000);</script><script src="language-selector.js"></script></body></html>
