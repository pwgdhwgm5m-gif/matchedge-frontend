<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Genel Sıralama</title><style>:root{--bg:#061b3a;--card:#0b2b59;--line:#244b79;--gold:#f2c94c;--muted:#91a7c7;--green:#35c878}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#092957,#061b3a);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:480px;margin:auto;padding:14px 12px 40px}.head{display:flex;align-items:center;gap:11px;padding:5px 0 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#08234a;z-index:3}.back{border:1px solid var(--line);background:var(--card);color:var(--gold);border-radius:10px;padding:9px 12px}.title{font-size:18px;font-weight:950}.sub{font-size:10px;color:var(--muted);margin-top:2px}.list{padding-top:12px}.row{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}.row.me{border-color:var(--gold)}.place{font-size:16px;font-weight:950;text-align:center}.name{font-size:13px;font-weight:900}.badge{font-size:9px;color:var(--muted);margin-top:3px}.right{text-align:right}.right strong{display:block;color:var(--gold);font-size:12px}.right span{font-size:9px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:60px 20px}</style></head><body><main class="app"><header class="head"><button class="back" onclick="location.href='edge-arena.html'">←</button><div><div class="title" id="title">GENEL SIRALAMA</div><div class="sub" id="sub">100 XP ve üzeri oyuncular</div></div></header><section class="list" id="list"><div class="empty">Yükleniyor…</div></section></main><script>const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+token},en=(localStorage.getItem('matchedge_lang')||'en')==='en';if(!token)location.href='giris.html';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(en){title.textContent='GENERAL RANKING';sub.textContent='Players with 100 XP or more'}async function load(){try{const r=await fetch(API+'/api/community/leaderboard',{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Unavailable');const me=d.me||{};list.innerHTML=(d.leaderboard||[]).map(p=>'<article class="row '+(p.username===me.username?'me':'')+'"><div class="place">'+(p.position<4?['','🥇','🥈','🥉'][p.position]:'#'+p.position)+'</div><div><div class="name">'+esc(p.username)+'</div><div class="badge">'+esc(p.rank?.icon||'')+' '+esc(p.rank?.name||'')+' · %'+(p.accuracy||0)+' '+(en?'accuracy':'isabet')+'</div></div><div class="right"><strong>'+p.xp+' XP</strong><span>🪙 '+p.edgeCoins+'</span></div></article>').join('')||'<div class="empty">'+(en?'No player has reached 100 XP yet.':'Henüz 100 XP’ye ulaşan oyuncu yok.')+'</div>'}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}load();setInterval(load,30000);</script><script src="language-selector.js"></script></body></html>
