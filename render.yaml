services:
  - type: web
    name: matchedge-frontend
    runtime: static
    branch: main
    buildCommand: echo "Static MatchEdge frontend"
    staticPublishPath: .
    autoDeployTrigger: commit
    previews:
      generation: manual
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
