<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MatchEdge - Maç Sonuçları</title>
<style>
  :root {
    --bg-base: #0a0e17;
    --bg-card: #121826;
    --bg-card-inner: #0d1220;
    --border-subtle: #1e2636;
    --teal: #2dd4bf;
    --purple: #9d7cf0;
    --amber: #f5b942;
    --red: #f0556b;
    --text-primary: #f2f4f8;
    --text-secondary: #8b93a7;
    --text-muted: #5a6478;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 90px;
    overflow-x: hidden;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 4px 18px;
  }
  .brand-name { font-size: 19px; font-weight: 800; }
  .brand-name .premium { color: var(--teal); margin-left: 4px; }
  .brand-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; margin-top: 2px; }

  /* ---------- Gunluk sekme cubugu ---------- */
  .day-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    min-width: 56px;
    cursor: pointer;
  }
  .day-tab.active {
    background: rgba(45,212,191,0.12);
    border-color: var(--teal);
  }
  .day-tab .dow { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
  .day-tab.active .dow { color: var(--teal); }
  .day-tab .dnum { font-size: 15px; font-weight: 800; }
  .day-tab .live-indicator {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--red);
    margin-top: 1px;
  }

  /* ---------- Canli mac banner ---------- */
  .section-label {
    font-size: 11.5px; font-weight: 700; letter-spacing: 1px;
    color: var(--text-secondary);
    margin: 4px 0 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .live-pip {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--red);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(240,85,107,0.6); }
    70% { box-shadow: 0 0 0 6px rgba(240,85,107,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,85,107,0); }
  }

  /* ---------- Mac karti ---------- */
  .match-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    position: relative;
  }
  .match-card.is-live { border-color: rgba(240,85,107,0.4); }
  .match-league {
    font-size: 10px; color: var(--text-muted);
    margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .match-status-pill {
    font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
  }
  .match-status-pill.live { background: rgba(240,85,107,0.15); color: var(--red); }
  .match-status-pill.ft { background: rgba(255,255,255,0.06); color: var(--text-muted); }
  .match-status-pill.ns { background: rgba(245,185,66,0.12); color: var(--amber); }

  .match-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .match-teams { flex: 1; }
  .team-line {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 0;
    font-size: 13.5px;
    font-weight: 600;
  }
  .team-line .tname { flex: 1; }
  .team-line .tscore { font-weight: 800; font-size: 15px; width: 24px; text-align: center; }

  .halftime-note {
    font-size: 10px; color: var(--text-muted); margin-top: 8px; text-align: right;
  }

  .fav-btn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-card-inner);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    font-size: 14px;
    margin-left: 10px;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .fav-btn.active {
    background: rgba(245,185,66,0.15);
    border-color: var(--amber);
    color: var(--amber);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---------- Canli gol bildirimi (toast) ---------- */
  .goal-toast-wrap {
    position: fixed;
    top: 14px; left: 0; right: 0;
    display: flex; justify-content: center;
    z-index: 100;
    pointer-events: none;
  }
  .goal-toast {
    background: linear-gradient(135deg, #1a2332, #121826);
    border: 1px solid var(--teal);
    border-radius: 14px;
    padding: 12px 18px;
    max-width: 420px;
    width: calc(100% - 32px);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    transform: translateY(-120%);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .goal-toast.show { transform: translateY(0); }
  .goal-toast-icon { font-size: 22px; }
  .goal-toast-text { font-size: 12.5px; font-weight: 700; line-height: 1.4; }
  .goal-toast-sub { font-size: 10.5px; color: var(--text-secondary); font-weight: 500; margin-top: 2px; }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-card);
    border-top: 1px solid var(--border-subtle);
    display: flex; justify-content: space-around;
    padding: 10px 0 20px;
  }
  .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--text-muted); }
  .nav-item.active { color: var(--teal); }
  .nav-icon { font-size: 18px; }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .lang-toggle {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
  }
  .lang-toggle .lang-code { font-size: 9.5px; font-weight: 800; color: var(--text-secondary); margin-left: 2px; }
</style>
</head>
<body>

<div class="goal-toast-wrap">
  <div class="goal-toast" id="goalToast">
    <div class="goal-toast-icon">⚽</div>
    <div>
      <div class="goal-toast-text" id="goalToastText">GOL!</div>
      <div class="goal-toast-sub" id="goalToastSub">—</div>
    </div>
  </div>
</div>

<div class="app">

  <div class="top-bar">
    <div>
      <div class="brand-name">MATCHEDGE<span class="premium">PREMIUM</span></div>
      <div class="brand-sub" data-i18n="brandSub">MATCH RESULTS</div>
    </div>
    <div class="top-actions">
      <div class="lang-toggle" id="langToggle">
        <span id="langFlag">🇬🇧</span><span class="lang-code" id="langCode">EN</span>
      </div>
    </div>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <div id="resultsContainer">
    <div class="empty-state" data-i18n="loading">Loading...</div>
  </div>

</div>

<div class="bottom-nav">
  <a class="nav-item" href="ana-sayfa.html"><span class="nav-icon">🏠</span><span data-i18n="navHome">Home</span></a>
  <a class="nav-item" href="mac-sonuclari.html"><span class="nav-icon">⚽</span><span data-i18n="navMatches">Matches</span></a>
  <a class="nav-item active" href="mac-sonuclari.html"><span class="nav-icon">📅</span><span data-i18n="navResults">Results</span></a>
  <a class="nav-item" href="mac-sonuclari.html"><span class="nav-icon">⭐</span><span data-i18n="navFav">Favorites</span></a>
</div>
  <div class="nav-item"><span class="nav-icon">⚽</span><span data-i18n="navMatches">Matches</span></div>
  <div class="nav-item active"><span class="nav-icon">📅</span><span data-i18n="navResults">Results</span></div>
  <div class="nav-item"><span class="nav-icon">⭐</span><span data-i18n="navFav">Favorites</span></div>
</div>

<script>
// Giris kontrolu - token yoksa giris ekranina yonlendir
(function() {
  if (!localStorage.getItem('matchedge_token')) {
    window.location.href = 'giris.html';
  }
})();

/**
 * BAĞLANTI NOKTASI:
 *   GET /api/results?date=YYYY-MM-DD  -> o gunun tum mac sonuclari (IY dahil)
 *   GET /api/live                     -> su an oynanan tum maclar (gol tespiti icin)
 * Her ikisi de matchedge-backend projesinde hazir.
 */
const API_BASE = 'https://matchedge-backend-kujb.onrender.com'; // örn: 'https://matchedge-backend.onrender.com'
const LIVE_POLL_INTERVAL_MS = 20000;

const TRANSLATIONS = {
  en: {
    brandSub: 'MATCH RESULTS', loading: 'Loading...',
    navHome: 'Home', navMatches: 'Matches', navResults: 'Results', navFav: 'Favorites',
    today: 'Today', noMatchesDate: 'No matches found for this date',
    liveMatches: 'LIVE MATCHES', otherMatches: 'OTHER MATCHES',
    live: 'LIVE', ft: 'FT', notStarted: 'Not Started',
    htPrefix: 'HT',
    goal: 'GOAL!', minuteSuffix: '\'',
    dowNames: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  },
  tr: {
    brandSub: 'MAÇ SONUÇLARI', loading: 'Yükleniyor...',
    navHome: 'Ana Sayfa', navMatches: 'Maçlar', navResults: 'Sonuçlar', navFav: 'Favoriler',
    today: 'Bugün', noMatchesDate: 'Bu tarihte maç bulunamadı',
    liveMatches: 'CANLI MAÇLAR', otherMatches: 'DİĞER MAÇLAR',
    live: 'CANLI', ft: 'MS', notStarted: 'Başlamadı',
    htPrefix: 'İY',
    goal: 'GOL!', minuteSuffix: '. dakika',
    dowNames: ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'],
  },
};

let currentLang = localStorage.getItem('matchedge_lang') || 'tr';
function t(key) { return TRANSLATIONS[currentLang][key] ?? key; }

function applyStaticTranslations() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.getElementById('langFlag').textContent = currentLang === 'tr' ? '🇬🇧' : '🇹🇷';
  document.getElementById('langCode').textContent = currentLang === 'tr' ? 'EN' : 'TR';
}

document.getElementById('langToggle').addEventListener('click', () => {
  currentLang = currentLang === 'tr' ? 'en' : 'tr';
  localStorage.setItem('matchedge_lang', currentLang);
  applyStaticTranslations();
  renderDayTabs();
  loadResults();
});

function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${localStorage.getItem('matchedge_token')}`,
  };
}

// Favoriler artik hesaba bagli (backend'de saklaniyor), cihazlar arasi
// senkronize olur. Sayfa acilisinda sunucudan cekilip bu Set'e yukleniyor,
// tiklamalar aninda sunucuya yaziliyor.
const favorites = new Set();

async function loadFavoritesFromServer() {
  try {
    const res = await fetch(`${API_BASE}/api/favorites`, { headers: authHeaders() });
    if (res.status === 401) {
      localStorage.removeItem('matchedge_token');
      window.location.href = 'giris.html';
      return;
    }
    const data = await res.json();
    (data.favorites || []).forEach(f => favorites.add(String(f.fixtureId)));
  } catch (err) {
    console.warn('Favoriler alinamadi:', err.message);
  }
}

// Gol tespiti icin bir onceki bilinen skorlari tutuyoruz
const lastKnownScores = new Map(); // fixtureId -> "home-away"

function getLastNDays(n) {
  const days = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d);
  }
  return days;
}

function formatDateKey(d) {
  return d.toISOString().split('T')[0];
}

function isToday(d) {
  return formatDateKey(d) === formatDateKey(new Date());
}

let selectedDate = formatDateKey(new Date());

function renderDayTabs() {
  const tabsEl = document.getElementById('dayTabs');
  const days = getLastNDays(7);
  const dowNames = t('dowNames');

  tabsEl.innerHTML = days.map(d => {
    const key = formatDateKey(d);
    const active = key === selectedDate;
    const label = isToday(d) ? t('today') : dowNames[d.getDay()];
    return `
      <div class="day-tab ${active ? 'active' : ''}" data-date="${key}">
        <div class="dow">${label}</div>
        <div class="dnum">${d.getDate()}</div>
        ${isToday(d) ? '<div class="live-indicator"></div>' : ''}
      </div>
    `;
  }).join('');

  tabsEl.querySelectorAll('.day-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedDate = tab.dataset.date;
      renderDayTabs();
      loadResults();
    });
  });
}

// Backend'e bağlı değilken önizleme için örnek veri
function generateFallbackResults(dateKey) {
  const today = isToday(new Date(dateKey));
  if (today) {
    return [
      {
        fixtureId: 'demo1', league: 'Premier League', statusShort: '2H', minute: 63,
        isLive: true, homeTeam: 'Brentford', awayTeam: 'Sunderland',
        homeScore: 1, awayScore: 0, halftimeHome: 0, halftimeAway: 0,
      },
      {
        fixtureId: 'demo2', league: 'La Liga', statusShort: 'NS', minute: null,
        isLive: false, homeTeam: 'Real Sociedad', awayTeam: 'Villarreal',
        homeScore: null, awayScore: null, halftimeHome: null, halftimeAway: null,
      },
    ];
  }
  return [
    {
      fixtureId: 'demo3', league: 'Süper Lig', statusShort: 'FT', minute: 90,
      isLive: false, homeTeam: 'Galatasaray', awayTeam: 'Trabzonspor',
      homeScore: 2, awayScore: 1, halftimeHome: 1, halftimeAway: 0,
    },
    {
      fixtureId: 'demo4', league: 'Bundesliga', statusShort: 'FT', minute: 90,
      isLive: false, homeTeam: 'Bayern Münih', awayTeam: 'Dortmund',
      homeScore: 3, awayScore: 2, halftimeHome: 2, halftimeAway: 1,
    },
  ];
}

async function loadResults() {
  const container = document.getElementById('resultsContainer');
  container.innerHTML = `<div class="empty-state">${t('loading')}</div>`;

  let matches = [];
  if (API_BASE) {
    try {
      const res = await fetch(`${API_BASE}/api/results?date=${selectedDate}`);
      if (res.ok) {
        const json = await res.json();
        matches = json.matches || [];
      }
    } catch (err) {
      console.warn('Sonuçlar alınamadı, örnek veri gösteriliyor:', err.message);
    }
  }

  if (matches.length === 0) {
    matches = generateFallbackResults(selectedDate);
  }

  renderResults(matches);
}

function statusLabel(m) {
  if (m.isLive) return `${t('live')} ${m.minute ?? ''}'`;
  if (m.statusShort === 'FT') return t('ft');
  if (m.statusShort === 'NS') return t('notStarted');
  return m.statusShort || '';
}

function statusClass(m) {
  if (m.isLive) return 'live';
  if (m.statusShort === 'NS') return 'ns';
  return 'ft';
}

function renderResults(matches) {
  const container = document.getElementById('resultsContainer');

  if (matches.length === 0) {
    container.innerHTML = `<div class="empty-state">${t('noMatchesDate')}</div>`;
    return;
  }

  const liveMatches = matches.filter(m => m.isLive);
  const otherMatches = matches.filter(m => !m.isLive);

  let html = '';

  if (liveMatches.length > 0) {
    html += `<div class="section-label"><span class="live-pip"></span>${t('liveMatches')}</div>`;
    html += liveMatches.map(renderMatchCard).join('');
  }

  if (otherMatches.length > 0) {
    if (liveMatches.length > 0) {
      html += `<div class="section-label" style="margin-top:18px;">${t('otherMatches')}</div>`;
    }
    html += otherMatches.map(renderMatchCard).join('');
  }

  container.innerHTML = html;

  // Favori butonlarina tiklama olayi bagla
  container.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation(); // karta tiklanmis gibi sayfa degistirmesin
      toggleFavorite(btn.dataset.fixtureId, btn.dataset.home, btn.dataset.away, btn);
    });
  });

  // Karta tiklaninca (favori butonu haric) ilgili analiz/canli ekranina git
  container.querySelectorAll('.match-card').forEach(card => {
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => {
      const fixtureId = card.dataset.fixtureId;
      const isLive = card.classList.contains('is-live');
      window.location.href = isLive
        ? `canli-simulator.html?fixtureId=${encodeURIComponent(fixtureId)}`
        : `analiz-ekrani.html?fixtureId=${encodeURIComponent(fixtureId)}`;
    });
  });
}

function escapeAttr(str) {
  return (str || '').replace(/"/g, '&quot;');
}

function renderMatchCard(m) {
  const homeScore = m.homeScore ?? '-';
  const awayScore = m.awayScore ?? '-';
  const hasHalftime = m.halftimeHome !== null && m.halftimeHome !== undefined;
  const isFav = favorites.has(String(m.fixtureId));

  return `
    <div class="match-card ${m.isLive ? 'is-live' : ''}" data-fixture-id="${m.fixtureId}">
      <div class="match-league">
        <span>${m.league || ''}</span>
        <span class="match-status-pill ${statusClass(m)}">${statusLabel(m)}</span>
      </div>
      <div class="match-row">
        <div class="match-teams">
          <div class="team-line">
            <span class="tname">${m.homeTeam}</span>
            <span class="tscore">${homeScore}</span>
          </div>
          <div class="team-line">
            <span class="tname">${m.awayTeam}</span>
            <span class="tscore">${awayScore}</span>
          </div>
          ${hasHalftime ? `<div class="halftime-note">${t('htPrefix')}: ${m.halftimeHome}-${m.halftimeAway}</div>` : ''}
        </div>
        ${m.isLive ? `
          <div class="fav-btn ${isFav ? 'active' : ''}" data-fixture-id="${m.fixtureId}" data-home="${escapeAttr(m.homeTeam)}" data-away="${escapeAttr(m.awayTeam)}">
            ${isFav ? '★' : '☆'}
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

async function toggleFavorite(fixtureId, homeTeam, awayTeam, btnEl) {
  const key = String(fixtureId);
  const wasFavorite = favorites.has(key);

  // Once arayuzu aninda guncelle (optimistic), sunucu cevabini beklemeden
  if (wasFavorite) {
    favorites.delete(key);
    btnEl.classList.remove('active');
    btnEl.textContent = '☆';
  } else {
    favorites.add(key);
    btnEl.classList.add('active');
    btnEl.textContent = '★';
  }

  try {
    if (wasFavorite) {
      await fetch(`${API_BASE}/api/favorites/${fixtureId}`, { method: 'DELETE', headers: authHeaders() });
    } else {
      await fetch(`${API_BASE}/api/favorites`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ fixtureId, homeTeam, awayTeam }),
      });
    }
  } catch (err) {
    console.warn('Favori güncellenemedi:', err.message);
  }
}

/**
 * Canli maclari periyodik olarak kontrol edip skor degisikligi
 * (gol) tespit eder ve ekranda bir toast bildirimi gosterir.
 */
async function pollLiveForGoals() {
  let liveMatches = [];

  if (API_BASE) {
    try {
      const res = await fetch(`${API_BASE}/api/live`);
      if (res.ok) {
        const json = await res.json();
        liveMatches = (json.matches || []).map(f => ({
          fixtureId: f.fixture.id,
          homeTeam: f.teams.home.name,
          awayTeam: f.teams.away.name,
          homeScore: f.goals.home,
          awayScore: f.goals.away,
          minute: f.fixture.status.elapsed,
        }));
      }
    } catch (err) {
      console.warn('Canlı gol kontrolü başarısız:', err.message);
      return;
    }
  } else {
    // Backend yokken demo amacli: gosterilen canli mac icin arada bir sahte gol uret
    liveMatches = simulateFallbackGoal();
  }

  liveMatches.forEach(m => {
    const key = String(m.fixtureId);
    const currentScore = `${m.homeScore}-${m.awayScore}`;
    const previousScore = lastKnownScores.get(key);

    if (previousScore && previousScore !== currentScore) {
      showGoalToast(m);
      // Eger bu mac favorilerdeyse ekrandaki karti da guncelle
      if (favorites.has(key)) {
        loadResults();
      }
    }
    lastKnownScores.set(key, currentScore);
  });
}

let fallbackGoalScore = { home: 1, away: 0 };
function simulateFallbackGoal() {
  // Yaklasik her 3 pollde bir demo gol uretir (sadece onizleme icin)
  if (Math.random() < 0.34) {
    if (Math.random() < 0.6) fallbackGoalScore.home++;
    else fallbackGoalScore.away++;
  }
  return [{
    fixtureId: 'demo1',
    homeTeam: 'Brentford',
    awayTeam: 'Sunderland',
    homeScore: fallbackGoalScore.home,
    awayScore: fallbackGoalScore.away,
    minute: Math.min(90, (lastKnownScores.get('demo1') ? 63 : 60) + Math.floor(Math.random() * 5)),
  }];
}

function showGoalToast(m) {
  const toast = document.getElementById('goalToast');
  document.getElementById('goalToastText').textContent =
    `${t('goal')} ${m.homeTeam} ${m.homeScore} - ${m.awayScore} ${m.awayTeam}`;
  document.getElementById('goalToastSub').textContent = `${m.minute ?? ''}${t('minuteSuffix')}`;

  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4500);
}

applyStaticTranslations();
renderDayTabs();
(async () => {
  await loadFavoritesFromServer();
  loadResults();
})();
setInterval(pollLiveForGoals, LIVE_POLL_INTERVAL_MS);
pollLiveForGoals();
</script>
