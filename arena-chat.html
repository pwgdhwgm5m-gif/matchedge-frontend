<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Arena Chat</title><style>:root{--bg:#061b3a;--card:#0b2b59;--line:#244b79;--gold:#f2c94c;--muted:#91a7c7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#092957,#061b3a);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.room{max-width:480px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:12px}.head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}.back{border:1px solid var(--line);background:var(--card);color:var(--gold);border-radius:10px;padding:9px 12px}.head b{font-size:17px}.head small{display:block;color:var(--muted);margin-top:2px}.feed{flex:1;overflow-y:scroll;overflow-x:hidden;padding:12px 7px 12px 0;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-gutter:stable}.feed::-webkit-scrollbar{width:6px}.feed::-webkit-scrollbar-track{background:#061b3a}.feed::-webkit-scrollbar-thumb{background:#315781;border-radius:999px}.bubble{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;max-width:88%}.bubble.mine{align-self:flex-end}.who{color:var(--gold);font-size:11px;font-weight:900;cursor:pointer}.text{font-size:13px;margin-top:4px;overflow-wrap:anywhere}.time{font-size:8px;color:var(--muted);margin-top:5px}.report{border:0;background:transparent;color:var(--muted);font-size:9px;padding:3px 0;margin-top:3px}.empty{text-align:center;color:var(--muted);margin:auto}.system-msg{background:#102f5c;border:1px solid #f2c94c88;border-radius:12px;padding:11px;margin-bottom:4px;font-size:11px;line-height:1.5;color:#d7e1f1}.system-msg b{display:block;color:#f2c94c;font-size:12px;margin-bottom:5px}.mod-alert{display:none;background:#3a2610;border:1px solid #f2c94c;color:#fff3c4;border-radius:11px;padding:10px;margin:8px 0;font-size:11px;line-height:1.45}.mod-alert.show{display:block}.compose{display:flex;gap:7px;padding:9px 0 max(6px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}.compose input{flex:1;min-width:0;background:#09244b;border:1px solid #315781;color:#fff;border-radius:11px;padding:12px}.compose button{border:0;border-radius:11px;background:var(--gold);padding:0 16px;font-weight:900}</style></head><body><main class="room"><header class="head"><button class="back" onclick="location.href='edge-arena.html'">←</button><div><b>💬 ARENA CHAT</b><small id="sub">SoccerEdge community room</small></div></header><div class="mod-alert" id="modAlert"></div><section class="feed" id="feed"><div class="empty">Loading chat…</div></section><form class="compose" id="form"><input id="input" maxlength="280" autocomplete="off" placeholder="Write a message…"><button id="send">SEND</button></form></main><script>const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+token,'Content-Type':'application/json'};if(!token)location.href='giris.html';const tr=(localStorage.getItem('matchedge_lang')||'en')==='tr',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(tr){sub.textContent='SoccerEdge topluluk odası';input.placeholder='Mesaj yaz…';send.textContent='GÖNDER'}let last='';async function loadModeration(){try{const r=await fetch(API+'/api/messages/moderation-status',{headers:H}),d=await r.json();if(!r.ok)return;const key='se_mod_seen_'+String(d.lastWarningAt||'')+'_'+String(d.suspendedUntil||'');if((d.lastWarningAt||d.suspendedUntil)&&!sessionStorage.getItem(key)){let msg=d.suspendedUntil?(tr?'⚠️ SoccerEdge Moderation: Topluluk kurallarının tekrar ihlali nedeniyle mesaj gönderme erişimin '+new Date(d.suspendedUntil).toLocaleString('tr-TR')+' tarihine kadar kısıtlandı.':'⚠️ SoccerEdge Moderation: Due to repeated community-rule violations, messaging is restricted until '+new Date(d.suspendedUntil).toLocaleString('en-GB')+'.'):(tr?'⚠️ SoccerEdge Moderation: Mesajlarından biri topluluk kurallarını ihlal ettiği için kaldırıldı. Bu ilk uyarındır. Tekrarlanırsa geçici mesajlaşma kısıtlaması uygulanabilir.':'⚠️ SoccerEdge Moderation: One of your messages was removed for violating community rules. This is your first warning. Repeated violations may result in a temporary messaging restriction.');modAlert.textContent=msg;modAlert.classList.add('show');sessionStorage.setItem(key,'1')}}catch{}}
async function load(){try{const r=await fetch(API+'/api/messages/arena',{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Chat unavailable');const rows=d.messages||[],sig=rows.map(x=>x.id).join(',');if(sig===last)return;const wasNearBottom=(feed.scrollHeight-feed.scrollTop-feed.clientHeight)<80;last=sig;const info='<div class="system-msg"><b>⚽ SoccerEdge · '+(tr?'Arena Chat Bilgilendirme':'Arena Chat Information')+'</b>'+(tr?'Bu oda genel topluluk sohbetidir. Mesajların diğer Arena kullanıcıları tarafından görülebilir. Saygılı ol; hakaret, küfür, taciz, spam ve uygunsuz içerik yasaktır. Mesajlar en fazla 24 saat tutulur. Bir kullanıcı adına dokunarak özel mesaj gönderebilirsin. Şikâyet edilen içerikler güvenlik ve moderasyon amacıyla incelenebilir.':'This is a public community chat. Messages can be seen by other Arena users. Be respectful; insults, harassment, spam and inappropriate content are not allowed. Messages are kept for up to 24 hours. Tap a username to send a private message. Reported content may be reviewed for safety and moderation.')+'</div>';feed.innerHTML=info+rows.map(m=>'<article class="bubble '+(m.mine?'mine':'')+'"><div class="who" '+(!m.mine?'onclick="location.href=\'mesajlar.html?user='+m.authorId+'\'"':'')+'>'+esc(m.authorName)+' · '+esc(m.rank?.icon||'')+' '+esc(m.rank?.name||'')+'</div><div class="text">'+esc(m.text)+'</div><div class="time">'+new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>'+(!m.mine?'<button class="report" onclick="reportMsg(\''+m.id+'\')">⚑ '+(tr?'Şikayet et':'Report')+'</button>':'')+'</article>').join('')||'<div class="empty">'+(tr?'Henüz mesaj yok. İlk mesajı sen yaz.':'No messages yet. Start the conversation.')+'</div>';if(wasNearBottom||!feed.dataset.loaded)feed.scrollTop=feed.scrollHeight;feed.dataset.loaded='1'}catch(e){feed.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function reportMsg(id){if(!confirm(tr?'Bu mesajı şikayet etmek istiyor musun?':'Report this message?'))return;try{const r=await fetch(API+'/api/messages/arena/'+id+'/report',{method:'POST',headers:H,body:JSON.stringify({reason:'abuse'})}),d=await r.json();if(!r.ok)throw Error(d.error||'Report failed');alert(tr?'Şikayet alındı ve otomatik moderasyon tarafından incelendi.':'Report received and reviewed by automated moderation.');last='';load()}catch(e){alert(e.message)}}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;send.disabled=true;try{const r=await fetch(API+'/api/messages/arena',{method:'POST',headers:H,body:JSON.stringify({text})}),d=await r.json();if(!r.ok)throw Error(d.error||'Message not sent');input.value='';last='';await load()}catch(e){alert(e.message)}finally{send.disabled=false;input.focus()}};loadModeration();load();setInterval(load,4000);setInterval(loadModeration,15000);</script><script src="language-selector.js"></script></body></html>
