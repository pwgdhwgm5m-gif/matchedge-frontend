<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SoccerEdge · Arena Chat</title><style>:root{--bg:#061b3a;--card:#0b2b59;--line:#244b79;--gold:#f2c94c;--muted:#91a7c7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#092957,#061b3a);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.room{max-width:480px;height:100dvh;margin:auto;display:flex;flex-direction:column;padding:12px}.head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}.back{border:1px solid var(--line);background:var(--card);color:var(--gold);border-radius:10px;padding:9px 12px}.head b{font-size:17px}.head small{display:block;color:var(--muted);margin-top:2px}.feed{flex:1;overflow-y:scroll;overflow-x:hidden;padding:12px 7px 12px 0;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-gutter:stable}.feed::-webkit-scrollbar{width:6px}.feed::-webkit-scrollbar-track{background:#061b3a}.feed::-webkit-scrollbar-thumb{background:#315781;border-radius:999px}.bubble{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;max-width:88%}.bubble.mine{align-self:flex-end}.who{color:var(--gold);font-size:11px;font-weight:900;cursor:pointer}.text{font-size:13px;margin-top:4px;overflow-wrap:anywhere}.time{font-size:8px;color:var(--muted);margin-top:5px}.empty{text-align:center;color:var(--muted);margin:auto}.compose{display:flex;gap:7px;padding:9px 0 max(6px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}.compose input{flex:1;min-width:0;background:#09244b;border:1px solid #315781;color:#fff;border-radius:11px;padding:12px}.compose button{border:0;border-radius:11px;background:var(--gold);padding:0 16px;font-weight:900}</style></head><body><main class="room"><header class="head"><button class="back" onclick="location.href='edge-arena.html'">←</button><div><b>💬 ARENA CHAT</b><small id="sub">SoccerEdge community room</small></div></header><section class="feed" id="feed"><div class="empty">Loading chat…</div></section><form class="compose" id="form"><input id="input" maxlength="280" autocomplete="off" placeholder="Write a message…"><button id="send">SEND</button></form></main><script>const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+token,'Content-Type':'application/json'};if(!token)location.href='giris.html';const tr=(localStorage.getItem('matchedge_lang')||'en')==='tr',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(tr){sub.textContent='SoccerEdge topluluk odası';input.placeholder='Mesaj yaz…';send.textContent='GÖNDER'}let last='';async function load(){try{const r=await fetch(API+'/api/messages/arena',{headers:H}),d=await r.json();if(!r.ok)throw Error(d.error||'Chat unavailable');const rows=d.messages||[],sig=rows.map(x=>x.id).join(',');if(sig===last)return;const wasNearBottom=(feed.scrollHeight-feed.scrollTop-feed.clientHeight)<80;last=sig;feed.innerHTML=rows.map(m=>'<article class="bubble '+(m.mine?'mine':'')+'"><div class="who" '+(!m.mine?'onclick="location.href=\'mesajlar.html?user='+m.authorId+'\'"':'')+'>'+esc(m.authorName)+' · '+esc(m.rank?.icon||'')+' '+esc(m.rank?.name||'')+'</div><div class="text">'+esc(m.text)+'</div><div class="time">'+new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div></article>').join('')||'<div class="empty">'+(tr?'Henüz mesaj yok. İlk mesajı sen yaz.':'No messages yet. Start the conversation.')+'</div>';if(wasNearBottom||!feed.dataset.loaded)feed.scrollTop=feed.scrollHeight;feed.dataset.loaded='1'}catch(e){feed.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;send.disabled=true;try{const r=await fetch(API+'/api/messages/arena',{method:'POST',headers:H,body:JSON.stringify({text})}),d=await r.json();if(!r.ok)throw Error(d.error||'Message not sent');input.value='';last='';await load()}catch(e){alert(e.message)}finally{send.disabled=false;input.focus()}};load();setInterval(load,4000);</script><script src="language-selector.js"></script></body></html>
