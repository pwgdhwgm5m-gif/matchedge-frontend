</head><body><main class="room"><header class="head"><button class="back" onclick="location.href='edge-arena.html'">←</button><div><b>💬 ARENA CHAT</b><small id="sub">SoccerEdge community room</small></div></header><div class="mod-alert" id="modAlert"></div><section class="feed" id="feed"><div class="empty">Loading chat…</div></section><form class="compose" id="form"><input id="input" maxlength="280" autocomplete="off" placeholder="Write a message…"><button id="send">SEND</button></form><div class="user-menu" id="userMenu" hidden><div class="user-menu-card"><div class="user-menu-name" id="userMenuName"></div><div class="user-menu-actions"><button id="userMessageBtn"></button><button class="friend" id="userFriendBtn"></button><button class="close" id="userCloseBtn"></button></div></div></div></main><script>const API='https://matchedge-backend-kujb.onrender.com',token=localStorage.getItem('matchedge_token'),H={Authorization:'Bearer '+token,'Content-Type':'application/json'};if(!token)location.href='giris.html';const tr=(localStorage.getItem('matchedge_lang')||'en')==='tr',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(tr){sub.textContent='SoccerEdge topluluk odası';input.placeholder='Mesaj yaz…';send.textContent='GÖNDER'}let last='',arenaUsername='',selectedUser=null;userMessageBtn.textContent=tr?'Mesaj Gönder':'Send Message';userFriendBtn.textContent=tr?'Arkadaş Ekle':'Add Friend';userCloseBtn.textContent=tr?'Kapat':'Close';userCloseBtn.onclick=()=>userMenu.hidden=true;userMenu.onclick=e=>{if(e.target===userMenu)userMenu.hidden=true};async function openUserMenu(username){selectedUser=username;userMenuName.textContent='@'+username;userFriendBtn.disabled=false;userFriendBtn.textContent=tr?'Arkadaş Ekle':'Add Friend';userMessageBtn.disabled=true;userMenu.hidden=false;try{const r=await fetch(API+'/api/community/profile/'+encodeURIComponent(username),{headers:H}),d=await r.json();if(!r.ok)return;userMessageBtn.disabled=false;userMessageBtn.onclick=()=>location.href='mesajlar.html?user='+encodeURIComponent(d.profile.id);const rel=d.relationship||'none';userFriendBtn.textContent=rel==='friends'?(tr?'Arkadaş ✓':'Friends ✓'):rel==='requested'?(tr?'İstek Gönderildi':'Requested'):rel==='incoming'?(tr?'Onayla':'Accept'):(tr?'Arkadaş Ekle':'Add Friend');userFriendBtn.disabled=rel==='friends'||rel==='requested';userFriendBtn.onclick=async()=>{userFriendBtn.disabled=true;const path=rel==='incoming'?'/api/community/friends/'+d.profile.id+'/accept':'/api/community/friends/'+d.profile.id+'/request';const rr=await fetch(API+path,{method:'POST',headers:H});if(rr.ok)userFriendBtn.textContent=rel==='incoming'?(tr?'Arkadaş ✓':'Friends ✓'):(tr?'İstek Gönderildi':'Requested');else userFriendBtn.disabled=false}}catch(_){}}async function loadArenaUser(){try{const r=await fetch(API+'/api/community/leaderboard',{headers:H}),d=await r.json();if(r.ok&&d.me?.username){arenaUsername=String(d.me.username);last='';load()}}catch{}}async function loadModeration(){try{const r=await fetch(API+'/api/messages/moderation-status',{headers:H}),d=await r.json();if(!r.ok)return;const key='se_mod_seen_'+String(d.lastWarningAt||'')+'_'+String(d.suspendedUntil||'');if((d.lastWarningAt||d.suspendedUntil)&&!sessionStorage.getItem(key)){let msg=d.suspendedUntil?(tr?'⚠️ SoccerEdge Moderation: Topluluk kurallarının tekrar ihlali nedeniyle mesaj gönderme erişimin '+new Date(d.suspendedUntil).toLocaleString('tr-TR')+' tarihine kadar kısıtlandı.':'⚠️ SoccerEdge Moderation: Due to repeated community-rule violations, messaging is restricted until '+new Date(d.suspendedUntil).toLocaleString('en-GB')+'.'):(tr?'⚠️ SoccerEdge Moderation: Mesajlarından biri topluluk kurallarını ihlal ettiği için kaldırıldı. Bu ilk uyarındır. Tekrarlanırsa geçici mesajlaşma kısıtlaması uygulanabilir.':'⚠️ SoccerEdge Moderation: One of your messages was removed for violating community rules. This is your first warning. Repeated violations may result in a temporary messaging restriction.');modAlert.textContent=msg;modAlert.classList.add('show');sessionStorage.setItem(key,'1')}}catch{}}
async function load(){try{const r=await fetch(API+'/api/messages/arena',{headers:H});const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch(_){throw Error(tr?'Chat sunucusu geçersiz yanıt verdi.':'Chat server returned an invalid response.')}if(!r.ok)throw Error(d.error||(tr?'Chat kullanılamıyor.':'Chat unavailable'));const rows=d.messages||[],sig=rows.map(x=>x.id).join(',');if(sig===last&&feed.dataset.loaded)return;const wasNearBottom=(feed.scrollHeight-feed.scrollTop-feed.clientHeight)<80;last=sig;const rules=tr?'📌 Arena Chat Kuralları\\n• Saygılı ol; hakaret, küfür ve taciz yasaktır.\\n• Spam ve uygunsuz içerik paylaşma.\\n• Kişisel bilgilerini paylaşma.\\n• Mesajlar en fazla 24 saat tutulur.\\n• Bir kullanıcı adına dokunarak özel mesaj gönderebilirsin.\\n• Uygunsuz mesajları Şikayet Et ile bildirebilirsin.':'📌 Arena Chat Rules\\n• Be respectful; insults and harassment are not allowed.\\n• No spam or inappropriate content.\\n• Do not share personal information.\\n• Messages are kept for up to 24 hours.\\n• Tap a username to open their analyst profile.\\n• Use Report for inappropriate messages.';const hello=arenaUsername?(tr?'👋 Merhaba '+esc(arenaUsername)+'! Arena Chat’e hoş geldin.':'👋 Hello '+esc(arenaUsername)+'! Welcome to Arena Chat.'):(tr?'👋 Arena Chat’e hoş geldin.':'👋 Welcome to Arena Chat.');const info='<div class="system-msg"><b>⚽ SoccerEdge · '+(tr?'Arena Chat':'Arena Chat')+'</b><div style="margin-top:8px;font-weight:800">'+hello+'</div><div style="margin-top:10px;white-space:pre-line">'+rules+'</div></div>';feed.innerHTML=info+rows.map(m=>'<article class="bubble '+(m.mine?'mine':'')+'"><div class="who" '+(!m.mine?'onclick="openUserMenu(decodeURIComponent(\''+encodeURIComponent(m.authorName)+'\'))"':'')+'>'+esc(m.authorName)+' · '+esc(m.rank?.icon||'')+' '+esc(m.rank?.name||'')+' <span class="rep" style="color:'+esc(m.analystTier?.color||'#9aa4b8')+'">'+esc(m.analystTier?.name||'Rookie')+' · '+Number(m.accuracy||0)+'%</span>'+'</div><div class="text">'+esc(m.text)+'</div><div class="time">'+new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>'+(!m.mine?'<button class="report" onclick="reportMsg(\''+m.id+'\')">⚑ '+(tr?'Şikayet et':'Report')+'</button>':'')+'</article>').join('')||'<div class="empty">'+(tr?'Henüz mesaj yok. İlk mesajı sen yaz.':'No messages yet. Start the conversation.')+'</div>';if(wasNearBottom||!feed.dataset.loaded)feed.scrollTop=feed.scrollHeight;feed.dataset.loaded='1'}catch(e){feed.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function reportMsg(id){if(!confirm(tr?'Bu mesajı şikayet etmek istiyor musun?':'Report this message?'))return;try{const r=await fetch(API+'/api/messages/arena/'+id+'/report',{method:'POST',headers:H,body:JSON.stringify({reason:'abuse'})}),d=await r.json();if(!r.ok)throw Error(d.error||'Report failed');alert(tr?'Şikayet alındı ve otomatik moderasyon tarafından incelendi.':'Report received and reviewed by automated moderation.');last='';load()}catch(e){alert(e.message)}}
form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;send.disabled=true;try{const r=await fetch(API+'/api/messages/arena',{method:'POST',headers:H,body:JSON.stringify({text})}),d=await r.json();if(!r.ok)throw Error(d.error||'Message not sent');input.value='';last='';await load()}catch(e){alert(e.message)}finally{send.disabled=false;input.focus()}};loadArenaUser();loadModeration();load();setInterval(load,4000);setInterval(loadModeration,15000);</script><script src="language-selector.js"></script></body></html>
